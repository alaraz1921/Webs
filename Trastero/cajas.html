<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cajas | Trastero</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/trastero.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="trastero-page" data-page="cajas" data-entity="caja">
    <div id="app-loading" class="app-loading">Comprobando acceso...</div>
    <main id="app-shell" class="app-shell" hidden>
        <header class="compact-header"><div><p class="app-kicker">Trastero</p><h1>Cajas</h1></div><button id="logout-button" class="button button-muted" type="button">Cerrar sesión</button></header>
        <nav class="app-nav" aria-label="Navegación de Trastero"><a href="index.html">Inicio</a><a href="zonas.html">Zonas</a><a class="active" href="cajas.html">Cajas</a><a href="objetos.html">Objetos</a></nav>
        <section class="panel">
            <div class="section-heading"><div><p class="eyebrow">Almacenamiento</p><h2>Tus cajas</h2></div><button class="button" type="button" data-action="new">Nueva caja</button></div>
            <input id="list-filter" class="search-input" type="search" placeholder="Filtrar cajas..." autocomplete="off">
            <div id="entity-list" class="card-list"></div>
        </section>
        <section id="detail-panel" class="panel" hidden></section>
        <section id="form-panel" class="panel" hidden>
            <div class="section-heading"><h2 id="form-title">Nueva caja</h2><button class="icon-button" type="button" data-action="close-form" aria-label="Cerrar">×</button></div>
            <form id="entity-form">
                <input id="entity-id" type="hidden">
                <label for="nombre">Nombre</label><input id="nombre" name="nombre" required maxlength="150">
                <label for="zona_id">Zona</label><select id="zona_id" name="zona_id"><option value="">Sin zona</option></select>
                <label for="ubicacion">Ubicación concreta</label><input id="ubicacion" name="ubicacion" maxlength="250" placeholder="Ej. Estantería superior, lado derecho">
                <label for="notas">Notas</label><textarea id="notas" name="notas" rows="5"></textarea>
                <div class="form-actions"><button class="button" type="submit">Guardar caja</button><button class="button button-muted" type="button" data-action="close-form">Cancelar</button></div>
            </form>
        </section>
        <a class="back-link" href="../Privado/index.html">Volver a la zona privada</a>
    </main>
    <div id="toast" class="toast" hidden></div>
    <script src="../assets/supabase-client.js"></script><script src="js/trastero.js"></script>
</body>
</html>
