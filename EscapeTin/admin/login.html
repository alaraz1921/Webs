<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ff5c7a">
    <link rel="manifest" href="../manifest.webmanifest">
    <title>Admin | EscapeTin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../assets/supabase-client.js"></script>
</head>
<body class="app-page" data-admin-page="login">
    <main class="app-shell admin-login-shell">
        <section class="mission-panel">
            <p class="eyebrow">Administracion</p>
            <h1>EscapeTin</h1>
            <form id="login-form" class="stack-form">
                <label for="identifier">Email o usuario</label>
                <input id="identifier" name="identifier" type="text" autocomplete="username" required>
                <label for="password">Contrasena</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required>
                <button class="btn btn-primary" type="submit">Entrar</button>
            </form>
            <a class="back-link" href="../index.html">Volver a EscapeTin</a>
            <p id="admin-status" class="form-status" role="status"></p>
        </section>
        <div id="permission-modal" class="permission-modal" hidden>
            <div class="permission-modal-box" role="dialog" aria-modal="true" aria-labelledby="permission-modal-title">
                <h2 id="permission-modal-title">Acceso no autorizado</h2>
                <p>No tienes permisos para entrar en la administracion de gincanas. Pide a un administrador que te asigne el rol de editor en EscapeTin.</p>
                <button class="btn btn-primary" type="button" id="permission-modal-close">Entendido</button>
            </div>
        </div>
    </main>
    <script src="admin.js"></script>
    <script src="../assets/pwa.js"></script>
</body>
</html>
