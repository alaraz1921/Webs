<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caza Multiplicaciones - Valentina's Playtime</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../assets/styles.css">
</head>
<body class="valentina-page multiplication-hunt bg-gradient-to-b from-blue-200 to-pink-200 min-h-screen flex flex-col items-center justify-center p-4">
    <div class="text-center">
        <h1 class="text-4xl md:text-5xl font-bold text-purple-600 mb-4">Caza Multiplicaciones</h1>
        <div id="currentMultiplication" class="text-2xl font-bold text-gray-700 mb-4">Multiplicación: ? × ? = ?</div>
        <div class="grid grid-cols-3 gap-2 bg-blue-400 p-4 rounded-2xl max-w-sm" id="gameGrid"></div>
        <div id="score" class="text-lg font-normal text-gray-700 mt-4">Aciertos: 0/10</div>
        <div id="timer" class="text-lg font-normal text-gray-700 mt-2">Tiempo: 0:00</div>
        <div class="flex flex-col sm:flex-row gap-4 mt-4">
            <button id="resetButton" class="game-button bg-green-400 text-white text-lg font-bold py-3 px-6 rounded-2xl shadow-lg">Reiniciar Juego</button>
            <a href="index.html" class="game-button bg-purple-400 text-white text-lg font-bold py-3 px-6 rounded-2xl shadow-lg text-center">Volver a Valentina's Playtime</a>
        </div>
    </div>

    <!-- Modal para confirmación -->
    <div id="confirmModal" class="modal">
        <div class="modal-content bg-blue-100">
            <h2 id="modalTitle" class="text-2xl font-bold text-purple-600 mb-4"></h2>
            <div class="flex justify-center gap-4">
                <button id="confirmYes" class="modal-button bg-green-400 text-white font-bold py-2 px-4 rounded-lg">Sí</button>
                <button id="confirmNo" class="modal-button bg-red-400 text-white font-bold py-2 px-4 rounded-lg">No</button>
            </div>
        </div>
    </div>

    <!-- Modal para felicitación -->
    <div id="winModal" class="modal">
        <div class="modal-content bg-blue-100">
            <h2 class="text-2xl font-bold text-purple-600 mb-4">¡Felicidades!</h2>
            <p id="winMessage" class="text-lg text-gray-700 mb-4">Has acertado 10 multiplicaciones. ¡Eres un genio!</p>
            <button id="winRestart" class="modal-button bg-green-400 text-white font-bold py-2 px-4 rounded-lg">Jugar de nuevo</button>
        </div>
    </div>

    <script>
        const gameGrid = document.getElementById('gameGrid');
        const currentMultiplicationDisplay = document.getElementById('currentMultiplication');
        const scoreDisplay = document.getElementById('score');
        const timerDisplay = document.getElementById('timer');
        const confirmModal = document.getElementById('confirmModal');
        const modalTitle = document.getElementById('modalTitle');
        const winModal = document.getElementById('winModal');
        const winMessage = document.getElementById('winMessage');
        let board = Array(2).fill().map(() => Array(3).fill(0));
        let currentMultiplication = { a: 0, b: 0, result: 0 };
        let score = 0;
        let startTime = null;
        let timerInterval = null;
        let confirmCallback = null;

        function showConfirmModal(message, callback) {
            modalTitle.textContent = message;
            confirmModal.style.display = 'flex';
            confirmCallback = callback;
        }

        function closeConfirmModal() {
            confirmModal.style.display = 'none';
            confirmCallback = null;
        }

        function showWinModal() {
            const totalTime = getFormattedTime();
            winMessage.textContent = `Has acertado 10 multiplicaciones en ${totalTime}. ¡Eres un genio!`;
            winModal.style.display = 'flex';
        }

        function closeWinModal() {
            winModal.style.display = 'none';
        }

        function generateMultiplication() {
            const a = Math.floor(Math.random() * 10) + 1;
            const b = Math.floor(Math.random() * 10) + 1;
            currentMultiplication = { a, b, result: a * b };
            currentMultiplicationDisplay.textContent = `Multiplicación: ${a} × ${b} = ?`;
        }

        function generateBoard() {
            const numbers = new Set([currentMultiplication.result]);
            while (numbers.size < 6) {
                const a = Math.floor(Math.random() * 10) + 1;
                const b = Math.floor(Math.random() * 10) + 1;
                numbers.add(a * b);
            }
            const numberArray = Array.from(numbers).sort(() => Math.random() - 0.5);
            let index = 0;
            for (let row = 0; row < 2; row++) {
                for (let col = 0; col < 3; col++) {
                    board[row][col] = numberArray[index++];
                }
            }
        }

        function createGrid() {
            gameGrid.innerHTML = '';
            for (let row = 0; row < 2; row++) {
                for (let col = 0; col < 3; col++) {
                    const cell = document.createElement('div');
                    cell.classList.add('game-cell', 'w-16', 'h-16', 'bg-white', 'border-2', 'border-gray-800', 'rounded-lg', 'flex', 'items-center', 'justify-center', 'text-xl', 'font-bold', 'text-gray-800');
                    cell.textContent = board[row][col];
                    cell.dataset.row = row;
                    cell.dataset.col = col;
                    cell.addEventListener('click', () => handleCellClick(row, col));
                    gameGrid.appendChild(cell);
                }
            }
        }

        function handleCellClick(row, col) {
            const cells = document.querySelectorAll('.game-cell');
            cells.forEach(cell => cell.classList.remove('correct', 'incorrect')); // Resetear todas las casillas
            const cell = document.querySelector(`[data-row="${row}"][data-col="${col}"]`);
            if (board[row][col] === currentMultiplication.result) {
                cell.classList.add('correct');
                if (score === 0) { // Iniciar timer en el primer acierto
                    startTime = Date.now();
                    timerInterval = setInterval(updateTimer, 1000);
                }
                score++;
                scoreDisplay.textContent = `Aciertos: ${score}/10`;
                if (score >= 10) {
                    clearInterval(timerInterval);
                    showWinModal();
                } else {
                    setTimeout(() => {
                        generateMultiplication();
                        generateBoard();
                        createGrid();
                    }, 500);
                }
            } else {
                cell.classList.add('incorrect');
                setTimeout(() => cell.classList.remove('incorrect'), 500);
            }
        }

        function updateTimer() {
            const elapsed = Date.now() - startTime;
            const minutes = Math.floor(elapsed / 60000);
            const seconds = Math.floor((elapsed % 60000) / 1000);
            timerDisplay.textContent = `Tiempo: ${minutes}:${seconds.toString().padStart(2, '0')}`;
        }

        function getFormattedTime() {
            const elapsed = Date.now() - startTime;
            const minutes = Math.floor(elapsed / 60000);
            const seconds = Math.floor((elapsed % 60000) / 1000);
            return `${minutes}:${seconds.toString().padStart(2, '0')}`;
        }

        function resetGame() {
            showConfirmModal('¿Estás seguro de que quieres reiniciar el juego? Esto limpiará tu progreso.', () => {
                score = 0;
                startTime = null;
                if (timerInterval) clearInterval(timerInterval);
                scoreDisplay.textContent = 'Aciertos: 0/10';
                timerDisplay.textContent = 'Tiempo: 0:00';
                generateMultiplication();
                generateBoard();
                createGrid();
                closeConfirmModal();
            });
        }

        document.getElementById('resetButton').addEventListener('click', resetGame);
        document.getElementById('confirmYes').addEventListener('click', () => confirmCallback && confirmCallback());
        document.getElementById('confirmNo').addEventListener('click', closeConfirmModal);
        document.getElementById('winRestart').addEventListener('click', () => {
            score = 0;
            startTime = null;
            if (timerInterval) clearInterval(timerInterval);
            scoreDisplay.textContent = 'Aciertos: 0/10';
            timerDisplay.textContent = 'Tiempo: 0:00';
            generateMultiplication();
            generateBoard();
            createGrid();
            closeWinModal();
        });

        generateMultiplication();
        generateBoard();
        createGrid();
    </script>
</body>
</html>
