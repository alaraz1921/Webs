<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caza Multiplicaciones - Valentina's Playtime</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../assets/styles.css">
</head>
<body class="valentina-page multiplication-hunt bg-gradient-to-b from-blue-200 to-pink-200 min-h-screen flex flex-col items-center justify-center p-4">
    <div class="text-center">
        <h1 class="text-4xl md:text-5xl font-bold text-purple-600 mb-4">Caza Multiplicaciones</h1>
        <div id="currentMultiplication" class="text-2xl font-bold text-gray-700 mb-4">Multiplicación: ? × ? = ?</div>
        <div class="grid grid-cols-3 gap-2 bg-blue-400 p-4 rounded-2xl max-w-sm" id="gameGrid"></div>
        <div id="score" class="text-lg font-normal text-gray-700 mt-4">Aciertos: 0/10</div>
        <div id="timer" class="text-lg font-normal text-gray-700 mt-2">Tiempo: 0:00</div>
        <div class="flex flex-col sm:flex-row gap-4 mt-4">
            <button id="resetButton" class="game-button bg-green-400 text-white text-lg font-bold py-3 px-6 rounded-2xl shadow-lg">Reiniciar Juego</button>
            <a href="index.html" class="game-button bg-purple-400 text-white text-lg font-bold py-3 px-6 rounded-2xl shadow-lg text-center">Volver a Valentina's Playtime</a>
        </div>
    </div>

    <!-- Modal para confirmación -->
    <div id="confirmModal" class="modal">
        <div class="modal-content bg-blue-100">
            <h2 id="modalTitle" class="text-2xl font-bold text-purple-600 mb-4"></h2>
            <div class="flex justify-center gap-4">
                <button id="confirmYes" class="modal-button bg-green-400 text-white font-bold py-2 px-4 rounded-lg">Sí</button>
                <button id="confirmNo" class="modal-button bg-red-400 text-white font-bold py-2 px-4 rounded-lg">No</button>
            </div>
        </div>
    </div>

    <!-- Modal para felicitación -->
    <div id="winModal" class="modal">
        <div class="modal-content bg-blue-100">
            <h2 class="text-2xl font-bold text-purple-600 mb-4">¡Felicidades!</h2>
            <p id="winMessage" class="text-lg text-gray-700 mb-4">Has acertado 10 multiplicaciones. ¡Eres un genio!</p>
            <button id="winRestart" class="modal-button bg-green-400 text-white font-bold py-2 px-4 rounded-lg">Jugar de nuevo</button>
        </div>
    </div>

    <script src="../assets/js/valentina-multiplication-hunt.js"></script>
</body>
</html>
