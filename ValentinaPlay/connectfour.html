<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conecta Cuatro - Valentina's Playtime</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap');
        body {
            font-family: 'Comic Neue', cursive;
        }
        .game-button {
            transition: transform 0.2s, background-color 0.3s;
        }
        .game-button:hover {
            transform: scale(1.05);
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background-color: white;
            padding: 20px;
            border-radius: 16px;
            text-align: center;
            max-width: 90%;
            width: 400px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .modal-button {
            transition: transform 0.2s, background-color 0.3s;
        }
        .modal-button:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body class="bg-gradient-to-b from-blue-200 to-pink-200 min-h-screen flex flex-col items-center justify-center p-4">
    <div class="text-center">
        <h1 class="text-4xl md:text-5xl font-bold text-purple-600 mb-4">Conecta Cuatro</h1>
        <div id="status" class="text-2xl text-gray-700 mb-4">Turno: Jugador 1 (Rojo)</div>
        <div class="grid grid-cols-7 gap-1 bg-blue-400 p-4 rounded-2xl" id="gameGrid"></div>
        <div class="flex flex-col sm:flex-row gap-4 mt-4">
            <button id="resetButton" class="game-button bg-green-400 text-white text-lg font-bold py-3 px-6 rounded-2xl shadow-lg">Reiniciar Juego</button>
            <a href="index.html" class="game-button bg-purple-400 text-white text-lg font-bold py-3 px-6 rounded-2xl shadow-lg text-center">Volver a Valentina's Playtime</a>
        </div>
    </div>

    <!-- Modal para confirmación -->
    <div id="confirmModal" class="modal">
        <div class="modal-content bg-blue-100">
            <h2 id="modalTitle" class="text-2xl font-bold text-purple-600 mb-4"></h2>
            <div class="flex justify-center gap-4">
                <button id="confirmYes" class="modal-button bg-green-400 text-white font-bold py-2 px-4 rounded-lg">Sí</button>
                <button id="confirmNo" class="modal-button bg-red-400 text-white font-bold py-2 px-4 rounded-lg">No</button>
            </div>
        </div>
    </div>

    <!-- Modal para ganador -->
    <div id="winModal" class="modal">
        <div class="modal-content bg-blue-100">
            <h2 id="winMessage" class="text-2xl font-bold text-purple-600 mb-4"></h2>
            <button id="winRestart" class="modal-button bg-green-400 text-white font-bold py-2 px-4 rounded-lg">Jugar de nuevo</button>
        </div>
    </div>

    <script>
        const gameGrid = document.getElementById('gameGrid');
        const statusDisplay = document.getElementById('status');
        const confirmModal = document.getElementById('confirmModal');
        const modalTitle = document.getElementById('modalTitle');
        const winModal = document.getElementById('winModal');
        const winMessage = document.getElementById('winMessage');
        let board = Array(6).fill().map(() => Array(7).fill(0));
        let currentPlayer = 1;
        let gameActive = true;
        let confirmCallback = null;

        function createGrid() {
            gameGrid.innerHTML = '';
            for (let row = 0; row < 6; row++) {
                for (let col = 0; col < 7; col++) {
                    const cell = document.createElement('div');
                    cell.classList.add('w-12', 'h-12', 'bg-white', 'rounded-full', 'border-2', 'border-gray-800');
                    cell.dataset.row = row;
                    cell.dataset.col = col;
                    cell.addEventListener('click', () => handleCellClick(col));
                    gameGrid.appendChild(cell);
                }
            }
        }

        function handleCellClick(col) {
            if (!gameActive) return;
            for (let row = 5; row >= 0; row--) {
                if (board[row][col] === 0) {
                    board[row][col] = currentPlayer;
                    const cell = document.querySelector(`[data-row="${row}"][data-col="${col}"]`);
                    cell.classList.add(currentPlayer === 1 ? 'bg-red-500' : 'bg-blue-600');
                    if (checkWin(row, col)) {
                        gameActive = false;
                        showWinModal(`¡Jugador ${currentPlayer} (${currentPlayer === 1 ? 'Rojo' : 'Azul'}) gana!`);
                    } else if (board.flat().every(cell => cell !== 0)) {
                        gameActive = false;
                        showWinModal('¡Empate!');
                    } else {
                        currentPlayer = currentPlayer === 1 ? 2 : 1;
                        statusDisplay.textContent = `Turno: Jugador ${currentPlayer} (${currentPlayer === 1 ? 'Rojo' : 'Azul'})`;
                    }
                    break;
                }
            }
        }

        function checkWin(row, col) {
            const directions = [
                [0, 1], [1, 0], [1, 1], [1, -1]
            ];
            for (let [dr, dc] of directions) {
                let count = 1;
                for (let i = 1; i <= 3; i++) {
                    const r = row + i * dr;
                    const c = col + i * dc;
                    if (r >= 0 && r < 6 && c >= 0 && c < 7 && board[r][c] === currentPlayer) {
                        count++;
                    } else {
                        break;
                    }
                }
                for (let i = 1; i <= 3; i++) {
                    const r = row - i * dr;
                    const c = col - i * dc;
                    if (r >= 0 && r < 6 && c >= 0 && c < 7 && board[r][c] === currentPlayer) {
                        count++;
                    } else {
                        break;
                    }
                }
                if (count >= 4) return true;
            }
            return false;
        }

        function showConfirmModal(message, callback) {
            modalTitle.textContent = message;
            confirmModal.style.display = 'flex';
            confirmCallback = callback;
        }

        function closeConfirmModal() {
            confirmModal.style.display = 'none';
            confirmCallback = null;
        }

        function showWinModal(message) {
            winMessage.textContent = message;
            winModal.style.display = 'flex';
        }

        function closeWinModal() {
            winModal.style.display = 'none';
        }

        function resetGame() {
            showConfirmModal('¿Estás seguro de que quieres reiniciar el juego?', () => {
                board = Array(6).fill().map(() => Array(7).fill(0));
                currentPlayer = 1;
                gameActive = true;
                statusDisplay.textContent = `Turno: Jugador ${currentPlayer} (Rojo)`;
                createGrid();
                closeConfirmModal();
            });
        }

        document.getElementById('resetButton').addEventListener('click', resetGame);
        document.getElementById('confirmYes').addEventListener('click', () => confirmCallback && confirmCallback());
        document.getElementById('confirmNo').addEventListener('click', closeConfirmModal);
        document.getElementById('winRestart').addEventListener('click', () => {
            resetGame();
            closeWinModal();
        });

        createGrid();
    </script>
</body>
</html>
