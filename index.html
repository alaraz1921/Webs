<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Portal personal de alaraz1921. Herramientas y proyectos para familia y amigos.">
    <title>alaraz1921</title>
    <!-- Importamos la fuente Manrope desde Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/styles.css">
</head>
<body class="home-page">

    <!-- MENÚ DE NAVEGACIÓN SUPERIOR -->
    <nav class="navbar" id="main-navbar">
        <div class="nav-container">
            <a href="#" class="nav-logo">alaraz1921</a>

            <button class="menu-toggle" id="mobile-menu-btn" aria-label="Abrir menú">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <ul class="nav-menu" id="nav-menu-list">
                <li class="nav-item"><a href="games.html">Games</a></li>
                <li class="nav-item"><a href="#contacto">Contacto</a></li>
            </ul>
        </div>
    </nav>

    <a class="private-quick-link" href="Privado/" aria-label="Acceder a la zona privada">
        <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7 11V8a5 5 0 0 1 10 0v3"></path>
            <rect x="5" y="11" width="14" height="10" rx="2"></rect>
            <path d="M12 15v2"></path>
        </svg>
    </a>

    <!-- HERO / PORTADA -->
    <header class="hero">
        <div class="hero-overlay"></div>
        <h1 class="hero-text">Nothing Gonna Change My World</h1>
    </header>

    <!-- CUERPO DE LA PÁGINA -->
    <main class="content-section">

        <!-- FORMULARIO DE CONTACTO -->
        <section class="contact-form" id="contacto">
            <h2>Contacto</h2>
            <form action="#" method="POST" onsubmit="enviarContacto(event)">
                <div class="form-group">
                    <label for="name">Nombre</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="subject">Asunto</label>
                    <input type="text" id="subject" name="subject" required>
                </div>
                <div class="form-group">
                    <label for="message">Mensaje</label>
                    <textarea id="message" name="message" rows="4" required></textarea>
                </div>
                <button type="submit" class="btn-submit">Enviar</button>
            </form>
        </section>

    </main>

    <!-- ─────────────── SCRIPTS DE CONTROL (JAVASCRIPT) ─────────────── */ -->
    <script src="assets/js/home.js"></script>

</body>
</html>
