<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>alaraz1921</title>
    <!-- Importamos la fuente Manrope desde Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/styles.css">
</head>
<body class="home-page">

    <!-- VENTANA MODAL (ABIERTA ÚNICAMENTE POR EL BOTÓN "OTROS" DE ABAJO) -->
    <div class="modal-overlay" id="otros-modal">
        <div class="modal-box">
            <button class="close-modal-btn" onclick="cerrarModal()">&times;</button>
            <h3>Otros Proyectos</h3>
            
            <div class="modal-buttons-container">
                <!-- Puedes cambiar estos enlaces de ejemplo por los tuyos propios -->
                <a href="impostor/" class="btn-modal-link">El Impostor</a>
                <a href="Bingo/carton.html" class="btn-modal-link">Bingo</a>
                <a href="Bingo/monitor.html" class="btn-modal-link">Monitor</a>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="mensaje-modal">
        <div class="modal-box">
            <button class="close-modal-btn" onclick="cerrarMensajeModal()">&times;</button>
            <h3>Mensaje enviado</h3>
            <p>Gracias por contactar. He recibido tu mensaje correctamente.</p>
            <div class="modal-buttons-container">
                <button class="btn-modal-link" onclick="cerrarMensajeModal()">Entendido</button>
            </div>
        </div>
    </div>

    <!-- MENÚ DE NAVEGACIÓN SUPERIOR -->
    <nav class="navbar" id="main-navbar">
        <div class="nav-container">
            <a href="#" class="nav-logo">alaraz1921</a>
            
            <button class="menu-toggle" id="mobile-menu-btn" aria-label="Abrir menú">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <ul class="nav-menu" id="nav-menu-list">
                <li class="nav-item"><a href="Privado/">Privado</a></li>
                <li class="nav-item"><a href="ValentinaPlay">Valentina's Play Time</a></li>
                
                <!-- MENÚ DESPLEGABLE TRADICIONAL (ABRE CON UN CLIC) -->
                <li class="nav-item has-submenu">
                    <a href="#" id="dropdown-trigger">Otros <span class="arrow">▼</span></a>
                    <ul class="submenu" id="custom-submenu">
                        <li><a href="Bingo/carton.html">Bingo</a></li>
                        <li><a href="Bingo/monitor.html">Monitor</a></li>
                        <li><a href="impostor/">El Impostor</a></li>
                    </ul>
                </li>
            </ul>
        </div>
    </nav>

    <!-- HERO / PORTADA -->
    <header class="hero">
        <div class="hero-overlay"></div>
        <h1 class="hero-text">Nothing Gonna Change My World</h1>
    </header>

    <!-- CUERPO DE LA PÁGINA -->
    <main class="content-section">
        
        <!-- GRID DE BOTONES ADAPTATIVOS -->
        <div class="buttons-grid">
            <button class="btn-section" onclick="location.href='Privado/'">Privado</button>
            <button class="btn-section" onclick="location.href='ValentinaPlay'">Valentina's Play Time</button>
            <!-- Este botón abre el Modal Emergente -->
            <button class="btn-section" onclick="abrirModal()">Otros</button>
        </div>

        <!-- FORMULARIO DE CONTACTO -->
        <section class="contact-form">
            <h2>Contacto</h2>
            <form action="#" method="POST" onsubmit="enviarContacto(event)">
                <div class="form-group">
                    <label for="name">Nombre</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="subject">Asunto</label>
                    <input type="text" id="subject" name="subject" required>
                </div>
                <div class="form-group">
                    <label for="message">Mensaje</label>
                    <textarea id="message" name="message" rows="4" required></textarea>
                </div>
                <button type="submit" class="btn-submit">Enviar</button>
            </form>
        </section>

    </main>

    <!-- ─────────────── SCRIPTS DE CONTROL (JAVASCRIPT) ─────────────── */ -->
    <script>
        // LÓGICA DEL MENÚ HAMBURGUESA EN MÓVILES
        const menuBtn = document.getElementById('mobile-menu-btn');
        const menuList = document.getElementById('nav-menu-list');

        menuBtn.addEventListener('click', () => {
            menuBtn.classList.toggle('open');
            menuList.classList.toggle('mobile-open');
        });

        // CONTROL DEL DESPLEGABLE "OTROS" (FUNCIONA CON CLIC EN ESCRITORIO Y MÓVIL)
        const dropdownTrigger = document.getElementById('dropdown-trigger');
        const customSubmenu = document.getElementById('custom-submenu');
        const parentItem = dropdownTrigger.parentElement;

        dropdownTrigger.addEventListener('click', (e) => {
            e.preventDefault(); // Evita que la página salte al inicio al pulsar '#'
            e.stopPropagation(); // Evita que el evento 'click' se propague al documento
            
            if (window.innerWidth > 768) {
                // Modo Escritorio: Activa/Desactiva el desplegable flotante
                customSubmenu.classList.toggle('desktop-open');
            } else {
                // Modo Móvil: Activa/Desactiva el menú colapsable vertical
                customSubmenu.classList.toggle('open');
            }
            parentItem.classList.toggle('active');
        });

        // DETECTAR CLICS FUERA DEL MENÚ PARA CERRARLO AUTOMÁTICAMENTE
        document.addEventListener('click', (e) => {
            // Si hacemos clic fuera del botón "Otros" y de su menú desplegable, lo cerramos
            if (!parentItem.contains(e.target)) {
                customSubmenu.classList.remove('desktop-open');
                customSubmenu.classList.remove('open');
                parentItem.classList.remove('active');
            }
        });

        // LÓGICA PARA CONTROLAR EL MODAL EMERGENTE (BOTÓN DE ABAJO)
        const modal = document.getElementById('otros-modal');
        const mensajeModal = document.getElementById('mensaje-modal');

        function abrirModal() {
            modal.style.display = 'flex';
        }

        function cerrarModal() {
            modal.style.display = 'none';
        }

        function enviarContacto(event) {
            event.preventDefault();
            event.target.reset();
            mensajeModal.style.display = 'flex';
        }

        function cerrarMensajeModal() {
            mensajeModal.style.display = 'none';
        }

        // Cerrar el modal si se pulsa sobre la capa oscura del fondo
        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                cerrarModal();
            }
        });

        mensajeModal.addEventListener('click', (e) => {
            if (e.target === mensajeModal) {
                cerrarMensajeModal();
            }
        });

        // CAMBIAR COLOR DEL NAVBAR AL HACER SCROLL (SÓLO ESCRITORIO)
        const navbar = document.getElementById('main-navbar');
        
        window.addEventListener('scroll', () => {
            if (window.innerWidth > 768) {
                if (window.scrollY > 50) {
                    navbar.classList.add('scrolled');
                } else {
                    navbar.classList.remove('scrolled');
                }
            }
        });
    </script>

</body>
</html>
