<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentina's Playtime - ¡Juega y Diviértete!</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap');
        body {
            font-family: 'Comic Neue', cursive;
        }
        .game-button {
            transition: transform 0.2s, background-color 0.3s;
        }
        .game-button:hover {
            transform: scale(1.05);
            background-color: #f59e0b;
        }
        .bounce {
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-20px);
            }
            60% {
                transform: translateY(-10px);
            }
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background-color: white;
            padding: 20px;
            border-radius: 16px;
            text-align: center;
            max-width: 90%;
            width: 400px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .modal-button {
            transition: transform 0.2s, background-color 0.3s;
        }
        .modal-button:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body class="bg-gradient-to-b from-blue-200 to-pink-200 min-h-screen flex flex-col items-center justify-center p-4">
    <div class="text-center">
        <h1 class="text-5xl md:text-7xl font-bold text-purple-600 mb-6 bounce">Valentina's Playtime</h1>
        <p class="text-xl md:text-2xl text-gray-700 mb-8">¡Diviértete con nuestros juegos!</p>
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 max-w-5xl w-full">
            <a href="bingo.html" class="game-button bg-yellow-400 text-white text-xl font-bold py-4 px-6 rounded-2xl shadow-lg text-center">
                Cartón de Bingo
            </a>
            <a href="tictactoe.html" class="game-button bg-green-400 text-white text-xl font-bold py-4 px-6 rounded-2xl shadow-lg text-center">
                3 en Raya
            </a>
            <a href="connectfour.html" class="game-button bg-red-400 text-white text-xl font-bold py-4 px-6 rounded-2xl shadow-lg text-center">
                Conecta Cuatro
            </a>
            <a href="number_to_number.html" class="game-button bg-orange-400 text-white text-xl font-bold py-4 px-6 rounded-2xl shadow-lg text-center">
                Número a Número
            </a>
            <button onclick="showPasswordModal()" class="game-button bg-blue-400 text-white text-xl font-bold py-4 px-6 rounded-2xl shadow-lg text-center">
                Monitor de Bingo
            </button>
            <a href="multiplication_hunt.html" class="game-button bg-purple-500 text-white text-xl font-bold py-4 px-6 rounded-2xl shadow-lg text-center">
                Caza Multiplicaciones
            </a>
            <a href="guess_the_number.html" class="game-button bg-pink-400 text-white text-xl font-bold py-4 px-6 rounded-2xl shadow-lg text-center">
                Adivina el Número
            </a>
            <a href="magic_clock.html" class="game-button bg-indigo-400 text-white text-xl font-bold py-4 px-6 rounded-2xl shadow-lg text-center">
                Reloj Mágico
            </a>
        </div>
    </div>

    <!-- Modal para la clave -->
    <div id="passwordModal" class="modal">
        <div class="modal-content bg-blue-100">
            <h2 class="text-2xl font-bold text-purple-600 mb-4">Introduce la clave</h2>
            <input id="passwordInput" type="password" class="w-full p-2 mb-4 border-2 border-gray-800 rounded-lg text-center" placeholder="Clave para el Monitor de Bingo">
            <p id="errorMessage" class="text-red-600 mb-4 hidden">Clave incorrecta. Inténtalo de nuevo.</p>
            <div class="flex justify-center gap-4">
                <button onclick="checkPassword()" class="modal-button bg-green-400 text-white font-bold py-2 px-4 rounded-lg">Aceptar</button>
                <button onclick="closePasswordModal()" class="modal-button bg-red-400 text-white font-bold py-2 px-4 rounded-lg">Cancelar</button>
            </div>
        </div>
    </div>

    <script>
        function showPasswordModal() {
            document.getElementById('passwordModal').style.display = 'flex';
            document.getElementById('passwordInput').focus();
            document.getElementById('errorMessage').classList.add('hidden');
        }

        function closePasswordModal() {
            document.getElementById('passwordModal').style.display = 'none';
            document.getElementById('passwordInput').value = '';
            document.getElementById('errorMessage').classList.add('hidden');
        }

        function checkPassword() {
            const password = document.getElementById('passwordInput').value;
            if (password === 'bingo123') {
                window.location.href = 'bingo_monitor.html';
            } else {
                document.getElementById('errorMessage').classList.remove('hidden');
                document.getElementById('passwordInput').value = '';
            }
        }
    </script>
</body>
</html>
