<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f26f61">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="EvenTin">
    <title>Galeria colaborativa | EvenTin</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/pwa.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/supabaseClient.js"></script>
    <script src="js/gallery.js" defer></script>
    <script src="js/reveal.js" defer></script>
</head>
<body class="simple-page gallery-page" data-gallery-mode="collaborative">
    <header class="gallery-header">
        <a href="index.html"><img src="assets/images/eventin-logo-transparent.png" alt="EvenTin"></a>
        <div class="gallery-header-title">
            <p class="eyebrow">Galeria colaborativa</p>
            <h1 id="gallery-event-title">Compartir recuerdos</h1>
        </div>
        <a id="gallery-event-link" class="gallery-back-link" href="index.html" aria-label="Volver al evento">Volver</a>
    </header>
    <main class="gallery-layout">
        <section id="gallery-access-panel" class="access-layout gallery-access-panel">
            <h2>Acceso a la galería</h2>
            <form id="gallery-access-form" class="form-card">
                <label>Clave<input type="password" name="access_key" autocomplete="current-password" required></label>
                <button type="submit">Entrar</button>
                <p id="gallery-access-status" class="form-status" role="status"></p>
            </form>
        </section>
        <div id="gallery-content" hidden>
            <section class="gallery-toolbar">
                <label class="icon-button secondary-button gallery-tool-button" for="gallery-file" aria-label="Añadir imagen" title="Añadir imagen">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
                </label>
                <input id="gallery-file" type="file" accept="image/*" hidden>
                <button id="gallery-slideshow-button" type="button" class="icon-button gallery-tool-button" aria-label="Iniciar presentación" title="Iniciar presentación">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 11 7-11 7Z"/></svg>
                </button>
            </section>
            <p id="gallery-status" class="form-status" role="status"></p>
            <section id="gallery-grid" class="gallery-grid" aria-label="Fotografias compartidas"></section>
            <p id="gallery-empty" class="gallery-empty" hidden>Todavía no hay fotografías compartidas.</p>
        </div>
    </main>
    <footer class="event-footer">
        <a class="developer-credit" href="index.html">Creado con ♥ por alaraz1921</a>
        <a class="eventin-discover-link" href="index.html">Descubre más en EvenTin</a>
    </footer>
    <div id="gallery-lightbox" class="gallery-lightbox" hidden>
        <button type="button" data-lightbox-action="close" aria-label="Cerrar">×</button>
        <button type="button" data-lightbox-action="previous" aria-label="Imagen anterior">‹</button>
        <img id="gallery-lightbox-image" alt="Fotografia ampliada">
        <button type="button" data-lightbox-action="next" aria-label="Imagen siguiente">›</button>
    </div>
    <div id="gallery-delete-modal" class="modal-backdrop" hidden>
        <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="gallery-delete-title">
            <h2 id="gallery-delete-title">Borrar imagen</h2>
            <p>Esta acción no se puede deshacer.</p>
            <div class="modal-actions">
                <button id="gallery-delete-cancel" type="button" class="secondary-button">Cancelar</button>
                <button id="gallery-delete-confirm" type="button" class="danger-button">Borrar</button>
            </div>
        </section>
    </div>
</body>
</html>
