<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion de invitados</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/supabaseClient.js"></script>
    <script src="js/guests.js" defer></script>
    <script src="js/reveal.js" defer></script>
</head>
<body class="simple-page admin-page">
    <main class="admin-layout guests-layout">
        <section id="guests-login-panel" class="access-layout" hidden>
            <h1>Gestion de invitados</h1>
            <form id="guests-login-form" class="form-card">
                <label>
                    Email
                    <input type="email" name="email" autocomplete="email" required>
                </label>
                <label>
                    Clave
                    <input type="password" name="password" autocomplete="current-password" required>
                </label>
                <button type="submit">Entrar</button>
                <p id="guests-login-status" class="form-status" role="status"></p>
            </form>
            <a class="page-link secondary-button" href="admin.html">Volver al panel</a>
        </section>

        <section id="guests-panel" class="admin-content" hidden>
            <div class="admin-header">
                <div class="admin-brand">
                    <a class="brand-home-link" href="index.html" aria-label="Ir a la portada de EvenTin">
                        <img src="assets/images/eventin-logo-transparent.png" alt="EvenTin" class="admin-logo">
                    </a>
                    <div>
                        <p id="guests-user-label" class="eyebrow">Usuario:</p>
                        <h1>Gestion de invitados</h1>
                    </div>
                </div>
                <a id="back-admin-link" class="secondary-button outline-secondary-button" href="admin.html">Volver</a>
            </div>

            <section class="data-panel admin-tools">
                <div class="admin-view-header">
                    <label id="guest-event-selector" class="event-selector">
                        Evento
                        <select id="guest-event-select"></select>
                    </label>
                    <div id="guest-event-title" class="event-user-title" hidden></div>
                </div>
            </section>

            <section class="data-panel admin-tools">
                <div class="admin-view-header">
                    <h2 id="guests-list-title">Invitados</h2>
                    <div class="admin-inline-actions">
                        <button id="copy-invitation-link" type="button" class="secondary-button">Copiar enlace de invitación</button>
                        <button id="new-guest-button" type="button" class="outline-secondary-button">Nuevo</button>
                    </div>
                </div>
                <div class="guest-list-controls">
                    <label>
                        Filtrar
                        <input id="guest-filter" type="search" placeholder="Nombre o telefono" autocomplete="off">
                    </label>
                    <label>
                        Ordenar por
                        <select id="guest-sort">
                            <option value="name">Nombre</option>
                            <option value="phone">Teléfono</option>
                            <option value="status">Estado</option>
                        </select>
                    </label>
                </div>
                <p id="guest-status" class="form-status" role="status"></p>
                <div class="table-wrap">
                    <table class="guests-table">
                        <thead>
                            <tr>
                                <th>Nombre</th>
                                <th>Teléfono 1</th>
                                <th>Teléfono 2</th>
                                <th>Adultos</th>
                                <th>Niños</th>
                                <th>Asistirá</th>
                                <th>Estado</th>
                            </tr>
                        </thead>
                        <tbody id="guests-table"></tbody>
                    </table>
                </div>
                <div class="pagination-controls">
                    <button id="guest-prev-page" type="button" class="secondary-button">Anterior</button>
                    <span id="guest-page-status"></span>
                    <button id="guest-next-page" type="button" class="secondary-button">Siguiente</button>
                </div>
                <div class="bottom-view-actions">
                    <a id="back-admin-link-bottom" class="secondary-button" href="admin.html">Volver</a>
                </div>
            </section>
        </section>
    </main>

    <footer class="event-footer">
        <a class="developer-credit" href="index.html">Creado con ♥ por alaraz1921</a>
        <a class="eventin-discover-link" href="index.html">Descubre más en EvenTin</a>
    </footer>

    <div id="guest-detail-modal" class="modal-backdrop" hidden>
        <section class="modal-card modal-card-wide" role="dialog" aria-modal="true" aria-labelledby="guest-detail-title">
            <h2 id="guest-detail-title">Invitado</h2>
            <form id="guest-form" class="admin-form modal-form">
                <input type="hidden" name="guest_id">
                <label>
                    Nombre
                    <input type="text" name="name" required>
                </label>
                <label>
                    Teléfono 1
                    <input type="tel" name="phone1" inputmode="tel">
                </label>
                <label>
                    Teléfono 2
                    <input type="tel" name="phone2" inputmode="tel">
                </label>
                <label>
                    Teléfono 3
                    <input type="tel" name="phone3" inputmode="tel">
                </label>
                <label>
                    Teléfono 4
                    <input type="tel" name="phone4" inputmode="tel">
                </label>
                <label>
                    Adultos
                    <input type="number" name="adults_count" min="0" value="1">
                </label>
                <label>
                    Niños
                    <input type="number" name="children_count" min="0" value="0">
                </label>
                <label>
                    Asistirá
                    <select name="will_attend">
                        <option value="">Sin respuesta</option>
                        <option value="true">Sí</option>
                        <option value="false">No</option>
                    </select>
                </label>
                <label>
                    Mensaje
                    <textarea name="message" rows="3"></textarea>
                </label>
                <label>
                    Estado
                    <input type="text" name="status_label" readonly>
                </label>
                <div id="guest-read-actions" class="modal-actions">
                    <button id="close-guest-detail" type="button" class="secondary-button">Cerrar</button>
                    <button id="delete-guest-button" type="button" class="danger-button">Eliminar</button>
                    <button id="edit-guest-button" type="button">Modificar</button>
                </div>
                <div id="guest-edit-actions" class="modal-actions" hidden>
                    <button id="cancel-guest-edit" type="button" class="secondary-button">Cancelar</button>
                    <button type="submit">Guardar</button>
                </div>
            </form>
        </section>
    </div>

    <div id="delete-guest-modal" class="modal-backdrop" hidden>
        <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="delete-guest-title">
            <h2 id="delete-guest-title">Borrar invitado</h2>
            <p id="delete-guest-message">Esta accion no se puede deshacer.</p>
            <div class="modal-actions">
                <button id="cancel-delete-guest" type="button" class="secondary-button">Cancelar</button>
                <button id="confirm-delete-guest" type="button" class="danger-button">Borrar</button>
            </div>
        </section>
    </div>
</body>
</html>
