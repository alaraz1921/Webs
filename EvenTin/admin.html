<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de administracion</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/supabaseClient.js"></script>
    <script src="js/admin.js" defer></script>
</head>
<body class="simple-page admin-page">
    <main class="admin-layout">
        <section id="login-panel" class="access-layout">
            <h1>Panel privado</h1>
            <form id="admin-login-form" class="form-card">
                <label>
                    Email
                    <input type="email" name="email" autocomplete="email" required>
                </label>
                <label>
                    Contrasena
                    <input type="password" name="password" autocomplete="current-password" required>
                </label>
                <button type="submit">Entrar</button>
                <p id="admin-login-status" class="form-status" role="status"></p>
            </form>
        </section>

        <section id="admin-panel" class="admin-content" hidden>
            <div class="admin-header">
                <div>
                    <p class="eyebrow">Gestion del evento</p>
                    <h1>Respuestas y mensajes</h1>
                </div>
                <button id="logout-button" type="button" class="secondary-button">Salir</button>
            </div>

            <label class="event-selector">
                Evento
                <select id="event-select"></select>
            </label>

            <section id="superadmin-panel" class="data-panel admin-tools" hidden>
                <h2>Superadministrador</h2>
                <form id="create-event-form" class="admin-form">
                    <label>
                        Nombre del evento
                        <input type="text" name="title" required>
                    </label>
                    <label>
                        Tipo
                        <select id="create-event-type" name="event_type" required></select>
                    </label>
                    <label>
                        Email del administrador
                        <input type="email" name="admin_email" required>
                    </label>
                    <button type="submit">Crear evento</button>
                </form>
                <button id="delete-event-button" type="button" class="danger-button">Borrar evento seleccionado</button>
                <p id="superadmin-status" class="form-status" role="status"></p>
            </section>

            <section class="data-panel admin-tools">
                <h2>Editar evento</h2>
                <p id="public-link" class="public-link"></p>
                <form id="event-settings-form" class="admin-form">
                    <label>
                        Fecha y hora
                        <input type="datetime-local" name="event_date" required>
                    </label>
                    <label>
                        Lugar
                        <input type="text" name="location_name">
                    </label>
                    <label>
                        Google Maps
                        <input type="url" name="maps_url">
                    </label>
                    <label>
                        Subtitulo
                        <input type="text" name="subtitle">
                    </label>
                    <label>
                        Fecha visible
                        <input type="text" name="display_date">
                    </label>
                    <label>
                        Hora visible
                        <input type="text" name="display_time">
                    </label>
                    <label>
                        Titulo de presentacion
                        <input type="text" name="presentation_title">
                    </label>
                    <label>
                        Texto de presentacion
                        <textarea name="presentation_text" rows="4"></textarea>
                    </label>
                    <label>
                        Imagen principal
                        <input type="url" name="hero_image_url">
                    </label>
                    <label>
                        Imagen detalle
                        <input type="url" name="detail_image_url">
                    </label>
                    <label>
                        Paleta
                        <select name="palette_key">
                            <option value="earth">Ocres y verdes</option>
                            <option value="pastel">Rosa y celeste pastel</option>
                            <option value="marine">Marinos, azules y verdes</option>
                        </select>
                    </label>
                    <button type="submit">Guardar cambios</button>
                </form>
                <p id="event-settings-status" class="form-status" role="status"></p>
            </section>

            <div class="admin-grid">
                <section class="data-panel">
                    <h2>Respuestas recibidas</h2>
                    <div class="table-wrap">
                        <table>
                            <thead>
                                <tr>
                                    <th>Nombre</th>
                                    <th>Telefono</th>
                                    <th>Asistencia</th>
                                    <th>Mensaje</th>
                                    <th>Creacion</th>
                                    <th>Actualizacion</th>
                                </tr>
                            </thead>
                            <tbody id="responses-table"></tbody>
                        </table>
                    </div>
                </section>

                <section class="data-panel">
                    <h2>Mensajes publicos</h2>
                    <div id="messages-list" class="message-list"></div>
                </section>
            </div>
        </section>
    </main>
</body>
</html>
