<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmar asistencia</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/supabaseClient.js"></script>
    <script src="js/invitation.js" defer></script>
</head>
<body class="simple-page">
    <main class="access-layout">
        <h1>Confirmar asistencia</h1>
        <form id="invitation-form" class="form-card">
            <label>
                Nombre
                <input type="text" name="nombre" autocomplete="name" required>
            </label>
            <label>
                Telefono
                <input type="tel" name="telefono" autocomplete="tel" inputmode="tel" required>
            </label>
            <fieldset>
                <legend>Asistencia</legend>
                <label class="radio-line">
                    <input type="radio" name="asistencia" value="true" required>
                    Si asistire
                </label>
                <label class="radio-line">
                    <input type="radio" name="asistencia" value="false" required>
                    No podre asistir
                </label>
            </fieldset>
            <label>
                Mensaje
                <textarea name="mensaje" rows="4"></textarea>
            </label>
            <button type="submit">Enviar respuesta</button>
            <p id="invitation-status" class="form-status" role="status"></p>
        </form>
        <a class="page-link" href="index.html">Volver</a>
    </main>
</body>
</html>
