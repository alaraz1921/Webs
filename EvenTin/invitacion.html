<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmar asistencia</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/supabaseClient.js"></script>
    <script src="js/eventContext.js"></script>
    <script src="js/invitation.js" defer></script>
</head>
<body class="simple-page invitation-page">
    <main class="access-layout invitation-layout">
        <header class="invitation-header">
            <img src="assets/images/eventin-logo-transparent.png" alt="EvenTin" class="admin-logo">
            <h1 data-invitation-title></h1>
        </header>
        <div id="invitation-detail-image" class="invitation-detail-image" hidden></div>
        <section class="invitation-heading" aria-labelledby="invitation-title">
            <h2 id="invitation-title">Confirmar asistencia</h2>
            <p id="guest-greeting" class="guest-greeting" hidden></p>
            <p><span data-invitation-date></span><span data-invitation-time></span></p>
        </section>
        <section id="invitation-not-found" class="form-card" hidden>
            <p>No hemos encontrado esta invitacion. Revisa el enlace o contacta con la persona que te lo envio.</p>
        </section>
        <form id="invitation-form" class="form-card">
            <label data-legacy-field>
                Nombre
                <input type="text" name="nombre" autocomplete="name" required>
            </label>
            <label data-legacy-field>
                Telefono
                <input type="tel" name="telefono" autocomplete="tel" inputmode="tel" required>
            </label>
            <fieldset>
                <legend>Asistencia</legend>
                <label class="radio-line">
                    <input type="radio" name="asistencia" value="true" required>
                    Si asistire
                </label>
                <label class="radio-line">
                    <input type="radio" name="asistencia" value="false" required>
                    No podre asistir
                </label>
            </fieldset>
            <label>
                Adultos confirmados
                <input type="number" name="adults_count" min="0" value="1">
            </label>
            <label>
                Ninos confirmados
                <input type="number" name="children_count" min="0" value="0">
            </label>
            <label>
                Mensaje
                <textarea name="mensaje" rows="4"></textarea>
            </label>
            <button type="submit">Enviar respuesta</button>
            <p id="invitation-status" class="form-status" role="status"></p>
        </form>
        <a id="event-link" class="page-link" href="index.html">Ir al evento</a>
        <footer class="app-credit">
            <a class="developer-credit" href="index.html">Desarrollado por alaraz1921 - VJG</a>
        </footer>
    </main>

    <div id="invitation-success-modal" class="modal-backdrop" hidden>
        <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="invitation-success-title">
            <h2 id="invitation-success-title">Respuesta enviada correctamente</h2>
            <p>Hemos recibido tu confirmacion correctamente.</p>
            <a id="modal-event-link" class="page-link" href="index.html">Volver al evento</a>
        </section>
    </div>
</body>
</html>
