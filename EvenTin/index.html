<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EvenTin</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/supabaseClient.js"></script>
    <script src="js/home.js" defer></script>
</head>
<body>
    <main class="home-page">
        <section class="home-hero" aria-labelledby="home-title">
            <form id="event-access-form" class="event-access">
                <label class="sr-only" for="event-code">ID de evento</label>
                <input id="event-code" name="event_code" type="text" inputmode="numeric" autocomplete="off" maxlength="6" pattern="[0-9]{6}" placeholder="ID de evento (6 digitos)" required>
                <button type="submit">Ir</button>
                <p id="event-access-status" class="form-status" role="status"></p>
            </form>

            <div class="leaf leaf-left" aria-hidden="true"></div>
            <div class="brand-mark" aria-hidden="true">
                <div class="brand-arc"></div>
                <div class="brand-leaves">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
                <h1 id="home-title"><span>Even</span><em>Tin</em></h1>
                <div class="brand-heart"><span></span></div>
            </div>

            <p class="home-tagline">tu evento, tu historia</p>

            <div class="home-features" aria-label="Servicios">
                <div>
                    <span class="feature-icon feature-calendar"></span>
                    <strong>Celebra</strong>
                </div>
                <div>
                    <span class="feature-icon feature-pin"></span>
                    <strong>Comparte</strong>
                </div>
                <div>
                    <span class="feature-icon feature-people"></span>
                    <strong>Disfruta</strong>
                </div>
                <div>
                    <span class="feature-icon feature-chat"></span>
                    <strong>Recuerda</strong>
                </div>
            </div>
        </section>

        <section class="home-contact" aria-labelledby="contact-title">
            <div class="leaf leaf-bottom-left" aria-hidden="true"></div>
            <div class="leaf leaf-bottom-right" aria-hidden="true"></div>
            <h2 id="contact-title">Contacto</h2>
            <form id="contact-form" class="contact-form">
                <label>
                    <span class="sr-only">Nombre</span>
                    <input type="text" name="nombre" autocomplete="name" placeholder="Nombre" required>
                </label>
                <label>
                    <span class="sr-only">Email</span>
                    <input type="email" name="email" autocomplete="email" placeholder="Email" required>
                </label>
                <label class="contact-wide">
                    <span class="sr-only">Asunto</span>
                    <input type="text" name="asunto" placeholder="Asunto" required>
                </label>
                <label class="contact-wide">
                    <span class="sr-only">Mensaje</span>
                    <textarea name="mensaje" rows="6" placeholder="Mensaje" required></textarea>
                </label>
                <button type="submit">Enviar</button>
                <p id="contact-status" class="form-status contact-wide" role="status"></p>
            </form>
        </section>

        <footer class="home-footer">
            <span>Comuniones</span>
            <i></i>
            <span>Bautizos</span>
            <i></i>
            <span>Bodas</span>
            <i></i>
            <span>Celebraciones</span>
        </footer>
    </main>
</body>
</html>
