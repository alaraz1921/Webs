<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EvenTin - Tu evento, tu historia</title>
    <meta name="description" content="EvenTin: Crea un espacio único para bodas, comuniones, bautizos y celebraciones. Comparte información, recuerdos y fotografías de tu evento con EvenTin.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/supabaseClient.js"></script>
    <script src="js/home.js" defer></script>
</head>
<body data-palette="home">
    <main class="home-page">
        <div class="home-topbar">
            <a class="login-icon-link" href="admin.html" aria-label="Iniciar sesion" title="Iniciar sesion">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="9" r="3.2" fill="currentColor" stroke="none"/><path d="M5.8 19a6.4 6.4 0 0 1 12.4 0" fill="currentColor" stroke="none"/></svg>
            </a>
            <form id="event-access-form" class="event-access" aria-label="Acceso a evento">
                <label class="sr-only" for="event-code">ID de evento</label>
                <input id="event-code" name="event_code" type="text" inputmode="numeric" autocomplete="off" maxlength="6" pattern="[0-9]{6}" placeholder="ID de evento (6 digitos)" required>
                <button type="submit">Ir</button>
                <p id="event-access-status" class="form-status" role="status"></p>
            </form>
        </div>
        <section class="home-hero" aria-labelledby="home-title">
            <div class="home-bg home-bg-left" aria-hidden="true"></div>
            <div class="home-bg home-bg-right" aria-hidden="true"></div>

            <div class="home-hero-content">
                <img id="home-title" src="assets/images/eventin-logo-transparent.png" alt="EvenTin" class="brand-logo">
                <p class="home-tagline">tu evento, tu historia</p>

                <div class="home-features" aria-label="Servicios">
                    <article class="feature">
                        <span class="feature-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24"><path d="M7 2v3M17 2v3M4 9h16M5 5h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Zm2 8h2m3 0h2m3 0h2M7 17h2m3 0h2m3 0h2"/></svg>
                        </span>
                        <strong>Celebra</strong>
                    </article>
                    <article class="feature">
                        <span class="feature-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24"><path d="M12 21s7-5.33 7-11a7 7 0 1 0-14 0c0 5.67 7 11 7 11Z"/><circle cx="12" cy="10" r="2.5"/></svg>
                        </span>
                        <strong>Comparte</strong>
                    </article>
                    <article class="feature">
                        <span class="feature-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24"><path d="M8 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm8 0a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM2.5 21a5.5 5.5 0 0 1 11 0M10.5 21a5.5 5.5 0 0 1 11 0"/></svg>
                        </span>
                        <strong>Disfruta</strong>
                    </article>
                    <article class="feature">
                        <span class="feature-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 1 1 17 0Z"/><path d="M12 15.8s-3.4-1.9-3.4-4.2A1.9 1.9 0 0 1 12 10.5a1.9 1.9 0 0 1 3.4 1.1c0 2.3-3.4 4.2-3.4 4.2Z"/></svg>
                        </span>
                        <strong>Recuerda</strong>
                    </article>
                </div>
            </div>
        </section>

        <section class="home-event-types" aria-label="Tipos de eventos">
            <div class="home-event-types-content">
                <p>Comuniones <span>-</span> Bautizos <span>-</span> Bodas <span>-</span> Celebraciones</p>
                <div class="tiny-heart" aria-hidden="true"><span></span><b>♥</b><span></span></div>
            </div>
        </section>

        <section class="home-contact" aria-labelledby="contact-title">
            <div class="contact-decoration contact-decoration-left" aria-hidden="true"></div>
            <div class="contact-decoration contact-decoration-right" aria-hidden="true"></div>
            <div class="contact-card">
                <h2 id="contact-title">Contacto</h2>
                <div class="title-line" aria-hidden="true"></div>
                <form id="contact-form" class="contact-form">
                    <div class="form-row">
                        <label>
                            <span class="sr-only">Nombre</span>
                            <input type="text" name="nombre" autocomplete="name" placeholder="Nombre" required>
                        </label>
                        <label>
                            <span class="sr-only">Email</span>
                            <input type="email" name="email" autocomplete="email" placeholder="Email" required>
                        </label>
                    </div>
                    <label class="contact-wide">
                        <span class="sr-only">Asunto</span>
                        <input type="text" name="asunto" placeholder="Asunto" required>
                    </label>
                    <label class="contact-wide">
                        <span class="sr-only">Mensaje</span>
                        <textarea name="mensaje" rows="5" placeholder="Mensaje" required></textarea>
                    </label>
                    <button type="submit">Enviar</button>
                    <p id="contact-status" class="form-status contact-wide" role="status"></p>
                </form>
            </div>
        </section>
    </main>
    <footer class="event-footer">
        <a class="developer-credit" href="https://www.alaraz1921.com/proyectos.html">Creado con ♥ por alaraz1921</a>
    </footer>
</body>
</html>
