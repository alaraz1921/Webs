<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurar clave</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/supabaseClient.js"></script>
    <script src="js/password-reset.js" defer></script>
</head>
<body class="simple-page admin-page reset-password-page">
    <div class="event-topbar">
        <a class="event-brand-link" href="index.html" aria-label="Ir a la portada de EvenTin" title="EvenTin">
            <img src="assets/images/eventin-logo-transparent.png" alt="EvenTin">
        </a>
        <a class="event-admin-link login-icon-link" href="admin.html" aria-label="Iniciar sesion" title="Iniciar sesion">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="9" r="3.2" fill="currentColor" stroke="none"/><path d="M5.8 19a6.4 6.4 0 0 1 12.4 0" fill="currentColor" stroke="none"/></svg>
        </a>
    </div>

    <main class="access-layout">
        <section id="request-reset-panel">
            <h1>Restaurar clave</h1>
            <form id="request-reset-form" class="form-card">
                <label>
                    Email
                    <input type="email" name="email" autocomplete="email" required>
                </label>
                <button type="submit">Enviar email</button>
                <p id="request-reset-status" class="form-status" role="status"></p>
            </form>
            <a id="back-to-login-link" class="page-link" href="admin.html">Volver al acceso</a>
        </section>

        <section id="update-password-panel" hidden>
            <h1>Nueva clave</h1>
            <form id="update-password-form" class="form-card">
                <label>
                    Nueva clave
                    <input type="password" name="password" autocomplete="new-password" minlength="8" required>
                </label>
                <label>
                    Repetir clave
                    <input type="password" name="password_confirm" autocomplete="new-password" minlength="8" required>
                </label>
                <button type="submit">Guardar clave</button>
                <p id="update-password-status" class="form-status" role="status"></p>
            </form>
            <a class="page-link" href="admin.html">Ir al acceso</a>
        </section>
    </main>
    <footer class="event-footer">
        <a class="developer-credit" href="index.html">Creado con ♥ por alaraz1921</a>
        <a class="eventin-discover-link" href="index.html">Descubre más en EvenTin</a>
    </footer>
</body>
</html>
