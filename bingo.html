<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartón de Bingo - Valentina's Playtime</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap');
        body {
            font-family: 'Comic Neue', cursive;
        }
        .bingo-cell:hover:not(.empty):not(.marked) {
            background-color: #fef08a;
            transform: scale(1.05);
        }
        .bingo-cell {
            transition: background-color 0.3s, transform 0.2s;
        }
        .bingo-cell.marked {
            background-color: #f87171 !important;
        }
        .game-button {
            transition: transform 0.2s, background-color 0.3s;
        }
        .game-button:hover {
            transform: scale(1.05);
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background-color: white;
            padding: 20px;
            border-radius: 16px;
            text-align: center;
            max-width: 90%;
            width: 400px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .modal-button {
            transition: transform 0.2s, background-color 0.3s;
        }
        .modal-button:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body class="bg-gradient-to-b from-blue-200 to-pink-200 min-h-screen flex flex-col items-center justify-center p-4">
    <div class="text-center">
        <!--<h1 class="text-4xl md:text-5xl font-bold text-purple-600 mb-4">Cartón de Bingo</h1>-->
        <div id="cartonId" class="text-xl text-gray-700 mb-4">ID del Cartón: -</div>
        <div class="grid grid-cols-9 gap-2 bg-blue-400 p-4 rounded-2xl max-w-3xl" id="bingoGrid"></div>
        <div class="flex flex-col sm:flex-row gap-4 mt-4">
            <button id="newCartonButton" class="game-button bg-yellow-400 text-white text-lg font-bold py-3 px-6 rounded-2xl shadow-lg">Nuevo Cartón</button>
            <button id="resetButton" class="game-button bg-green-400 text-white text-lg font-bold py-3 px-6 rounded-2xl shadow-lg">Reiniciar</button>
            <a href="index.html" class="game-button bg-purple-400 text-white text-lg font-bold py-3 px-6 rounded-2xl shadow-lg text-center">Volver a Valentina's Playtime</a>
        </div>
    </div>

    <!-- Modal para confirmaciones -->
    <div id="confirmModal" class="modal">
        <div class="modal-content bg-blue-100">
            <h2 id="modalTitle" class="text-2xl font-bold text-purple-600 mb-4"></h2>
            <div class="flex justify-center gap-4">
                <button id="confirmYes" class="modal-button bg-green-400 text-white font-bold py-2 px-4 rounded-lg">Sí</button>
                <button id="confirmNo" class="modal-button bg-red-400 text-white font-bold py-2 px-4 rounded-lg">No</button>
            </div>
        </div>
    </div>

    <script>
        const bingoGrid = document.getElementById('bingoGrid');
        const cartonIdDisplay = document.getElementById('cartonId');
        const confirmModal = document.getElementById('confirmModal');
        const modalTitle = document.getElementById('modalTitle');
        let confirmCallback = null;

        function showConfirmModal(message, callback) {
            modalTitle.textContent = message;
            confirmModal.style.display = 'flex';
            confirmCallback = callback;
        }

        function closeConfirmModal() {
            confirmModal.style.display = 'none';
            confirmCallback = null;
        }

        function generateCartonId() {
            return Math.floor(Math.random() * (1299 - 1001 + 1)) + 1001;
        }

        function generateBingoNumbers() {
            const numbers = Array.from({ length: 90 }, (_, i) => i + 1);
            const selectedNumbers = [];
            for (let i = 0; i < 15; i++) {
                const randomIndex = Math.floor(Math.random() * numbers.length);
                selectedNumbers.push(numbers.splice(randomIndex, 1)[0]);
            }
            return selectedNumbers.sort((a, b) => a - b);
        }

        function generateEmptyCells() {
            const emptyCells = [];
            for (let row = 0; row < 3; row++) {
                const rowIndexes = Array.from({ length: 9 }, (_, i) => i);
                const emptyIndexes = [];
                for (let i = 0; i < 4; i++) {
                    const randomIndex = Math.floor(Math.random() * rowIndexes.length);
                    emptyIndexes.push(rowIndexes.splice(randomIndex, 1)[0]);
                }
                emptyCells.push(emptyIndexes.sort((a, b) => a - b));
            }
            return emptyCells;
        }

        function createCarton() {
            bingoGrid.innerHTML = '';
            const numbers = generateBingoNumbers();
            const emptyCells = generateEmptyCells();
            cartonIdDisplay.textContent = `ID del Cartón: ${generateCartonId()}`;
            let numberIndex = 0;

            for (let row = 0; row < 3; row++) {
                for (let col = 0; col < 9; col++) {
                    const cell = document.createElement('div');
                    cell.classList.add('bingo-cell', 'w-12', 'h-12', 'bg-white', 'border-2', 'border-gray-800', 'rounded-lg', 'flex', 'items-center', 'justify-center', 'text-lg', 'font-bold', 'text-gray-800');
                    if (emptyCells[row].includes(col)) {
                        cell.classList.add('empty', 'bg-gray-400');
                    } else {
                        cell.textContent = numbers[numberIndex];
                        cell.addEventListener('click', () => {
                            cell.classList.toggle('marked');
                        });
                        numberIndex++;
                    }
                    bingoGrid.appendChild(cell);
                }
            }
        }

        function newCarton() {
            showConfirmModal('¿Estás seguro de que quieres generar un nuevo cartón? Esto cambiará los números y el ID.', () => {
                createCarton();
                closeConfirmModal();
            });
        }

        function resetCarton() {
            showConfirmModal('¿Estás seguro de que quieres reiniciar el cartón? Esto desmarcará todas las casillas.', () => {
                const cells = document.querySelectorAll('.bingo-cell:not(.empty)');
                cells.forEach(cell => cell.classList.remove('marked'));
                closeConfirmModal();
            });
        }

        document.getElementById('newCartonButton').addEventListener('click', newCarton);
        document.getElementById('resetButton').addEventListener('click', resetCarton);
        document.getElementById('confirmYes').addEventListener('click', () => confirmCallback && confirmCallback());
        document.getElementById('confirmNo').addEventListener('click', closeConfirmModal);

        createCarton();
    </script>
</body>
</html>
