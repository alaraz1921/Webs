<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Proyectos digitales para eventos, celebraciones y causas solidarias. Invitaciones online, gestión de invitados, galerías colaborativas y juegos para la familia.">
    <title>Alaraz1921 | Proyectos web, eventos y experiencias digitales</title>
    <link rel="stylesheet" href="../assets/styles.css">
</head>
<body class="bingo-carton-page">
    <header class="app-page-header">
        <p class="app-page-kicker">alaraz1921</p>
        <h1>BINGO</h1>
    </header>

    <nav class="bingo-top-menu" aria-label="Menu de Bingo">
        <button class="bingo-menu-toggle" id="bingoMenuToggle" type="button" aria-label="Abrir menu de Bingo" aria-expanded="false">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <div class="bingo-menu-list" id="bingoMenuList">
            <button type="button" id="bingoHelpMenuBtn">Ayuda</button>
            <a href="monitor.html">Monitor</a>
        </div>
    </nav>

    <div class="contenedor-tabla">
        <table id="tabla-carton"></table>
    </div>

    <div class="panel-botones">
        <button class="btn-empezar" id="btnAccion" onclick="conmutarEstadoJuego()">EMPEZAR PARTIDA</button>
        <button class="btn-limpiar" id="btnLimpiar" onclick="solicitarLimpieza()">LIMPIAR</button>
        <button class="btn-cambiar" id="btnCambiar" onclick="solicitudCambioCarton()">CAMBIAR CART&Oacute;N</button>
        <button class="btn-principal btn-home" type="button" onclick="solicitarVolverPrincipal()">
            <svg class="home-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 11.5 12 4l9 7.5"></path>
                <path d="M5.5 10.5V20h13v-9.5"></path>
                <path d="M9.5 20v-6h5v6"></path>
            </svg>
            <span>Volver a Games</span>
        </button>
    </div>

    <div class="zona-validacion" id="zonaCambio">
        <p>Comunica esta clave al Monitor:</p>
        <div class="clave-box" id="txtClave">0000</div>
        <p>Introduce la contraclave recibida:</p>
        <input type="number" id="inputContraclave" placeholder="0000" inputmode="numeric" min="0" max="9999" oninput="if(this.value.length > 4) this.value = this.value.slice(0,4);">
        <button class="btn-confirmar-cambio" onclick="procesarCambioCarton()">Validar y Cambiar</button>
    </div>

    <div id="miModalConfirm" class="modal-background">
        <div class="modal-box">
            <p id="textoModalConfirm">&iquest;Est&aacute;s seguro?</p>
            <div class="modal-flex-botones">
                <div class="modal-cell"><button class="btn-modal-ok" id="btnModalConfirmSi">S&iacute;</button></div>
                <div class="modal-cell"><button class="btn-modal-cancel" id="btnModalConfirmNo">No</button></div>
            </div>
        </div>
    </div>

    <div id="miModalAlert" class="modal-background">
        <div class="modal-box">
            <p id="textoModalAlert">Aviso del sistema</p>
            <button class="btn-modal-alert" onclick="cerrarModalAlert()">Entendido</button>
        </div>
    </div>

    <script src="../assets/js/bingo-carton.js"></script>
</body>
</html>
