<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor de Bingo Profesional</title>
    <link rel="stylesheet" href="../assets/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bingo-monitor-page">

    <div id="pantallaLogin">
        <header class="app-page-header login-page-title">
            <p class="app-page-kicker">alaraz1921</p>
            <h1>MONITOR BINGO</h1>
        </header>
        <div class="login-box">
            <h2>CONTROL DE ACCESO</h2>
            <p>Introduce el PIN del Monitor para gestionar la partida:</p>
            <input type="password" id="pinAcceso" placeholder="****" inputmode="numeric" pattern="[0-9]*" maxlength="4" onkeypress="if(event.key === 'Enter') verificarPin();">
            <button class="btn-entrar" onclick="verificarPin()">ENTRAR</button>
            <div class="error-login" id="msgError">CLAVE INCORRECTA</div>
        </div>
        <a class="btn-principal btn-login-principal btn-home" href="../games.html">
            <svg class="home-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 11.5 12 4l9 7.5"></path>
                <path d="M5.5 10.5V20h13v-9.5"></path>
                <path d="M9.5 20v-6h5v6"></path>
            </svg>
            <span>Volver a Games</span>
        </a>
    </div>

    <header class="app-page-header">
        <p class="app-page-kicker">alaraz1921</p>
        <h1>MONITOR BINGO</h1>
    </header>

    <div class="marcador-bolas">
        <div class="bola-actual" id="bolaActual">--</div>
        <div class="bola-anterior">Bola anterior: <span id="bolaAnterior">--</span></div>
    </div>

    <div class="contenedor-tabla">
        <table id="tabla-panel"></table>
    </div>

    <div class="panel-botones">
        <button class="btn-comenzar" id="btnControl" onclick="conmutarJuego()">Comenzar</button>
        <button class="btn-validar" onclick="alternarZonaValidar()">Validar Cart&oacute;n</button>
        <button class="btn-limpiar" onclick="reiniciarTodo()">Limpiar</button>
        <a class="btn-principal btn-home" href="../games.html">
            <svg class="home-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 11.5 12 4l9 7.5"></path>
                <path d="M5.5 10.5V20h13v-9.5"></path>
                <path d="M9.5 20v-6h5v6"></path>
            </svg>
            <span>Volver a Games</span>
        </a>
        <button class="help-button help-button-bottom" type="button" onclick="mostrarAyudaMonitor()" aria-label="Ayuda del monitor de Bingo">?</button>
    </div>

    <div class="zona-validacion" id="zonaValidar">
        <p style="margin-bottom: 8px;">Introduce la clave del Jugador:</p>
        <input type="number" id="claveJugador" class="input-num" placeholder="0000" inputmode="numeric" min="1000" max="9999" oninput="if(this.value.length > 4) this.value = this.value.slice(0,4);">
        <button style="width:auto; display:inline-block; padding: 8px 15px;" class="btn-validar" onclick="calcularContraclave()">Calcular</button>
        <div class="resultado-validacion" id="resultadoContraclave"></div>
    </div>


    <div id="monitorModalConfirm" class="modal-background">
        <div class="modal-box">
            <p id="textoMonitorModalConfirm">&iquest;Est&aacute;s seguro?</p>
            <div class="modal-flex-botones">
                <div class="modal-cell"><button class="btn-modal-ok" id="btnMonitorConfirmSi">S&iacute;</button></div>
                <div class="modal-cell"><button class="btn-modal-cancel" id="btnMonitorConfirmNo">No</button></div>
            </div>
        </div>
    </div>
    <div id="monitorModalAlert" class="modal-background">
        <div class="modal-box">
            <p id="textoMonitorModalAlert">Aviso del sistema</p>
            <button class="btn-modal-ok" onclick="cerrarAlertaMonitor()">Entendido</button>
        </div>
    </div>
    <script src="../assets/supabase-client.js"></script>
    <script src="../assets/js/bingo-monitor.js"></script>
</body>
</html>
