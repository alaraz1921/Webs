<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Proyectos digitales para eventos, celebraciones y causas solidarias. Invitaciones online, gestión de invitados, galerías colaborativas y juegos para la familia.">
    <title>Alaraz1921 | Proyectos web, eventos y experiencias digitales</title>
    <meta name="theme-color" content="#0b132b">
    <meta name="application-name" content="Bingo Alaraz1921">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Bingo Alaraz1921">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script>
        if (new URLSearchParams(window.location.search).get('pwa') === '1'
            || window.matchMedia('(display-mode: standalone)').matches
            || window.matchMedia('(display-mode: fullscreen)').matches
            || window.matchMedia('(display-mode: minimal-ui)').matches
            || window.navigator.standalone === true) {
            document.documentElement.classList.add('pwa-standalone');
        }
    </script>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icons/bingo-icon-192.png" type="image/png">
    <link rel="apple-touch-icon" href="icons/bingo-icon-192.png">
    <link rel="stylesheet" href="../assets/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bingo-monitor-page">

    <div id="pantallaLogin">
        <header class="app-page-header login-page-title">
            <p class="app-page-kicker">alaraz1921</p>
            <h1>MONITOR BINGO</h1>
        </header>
        <div class="login-box">
            <h2>CONTROL DE ACCESO</h2>
            <p>Introduce tu usuario y clave para gestionar la partida:</p>
            <form id="bingoLoginForm">
                <input type="text" id="bingoUsuario" placeholder="Usuario o email" autocomplete="username" required>
                <input type="password" id="bingoClave" placeholder="Clave" autocomplete="current-password" required>
                <button class="btn-entrar" type="submit">ENTRAR</button>
                <a class="auth-text-link" href="../games.html?auth=recovery">Restaurar contraseña</a>
                <a class="auth-register-button" href="../games.html?auth=register">NUEVO REGISTRO</a>
            </form>
            <div class="error-login" id="msgError">ACCESO INCORRECTO</div>
        </div>
        <button class="btn-principal btn-login-principal btn-home hide-in-pwa" type="button" onclick="solicitarVolverGames()">
            <svg class="home-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 11.5 12 4l9 7.5"></path>
                <path d="M5.5 10.5V20h13v-9.5"></path>
                <path d="M9.5 20v-6h5v6"></path>
            </svg>
            <span>Volver a Games</span>
        </button>
    </div>

    <header class="app-page-header">
        <p class="app-page-kicker">alaraz1921</p>
        <h1>MONITOR BINGO</h1>
    </header>

    <p class="partida-id">Id Partida: <strong id="partidaId">---</strong></p>

    <div class="marcador-bolas">
        <div class="bola-actual" id="bolaActual">--</div>
        <div class="bola-anterior">Bola anterior: <span id="bolaAnterior">--</span></div>
    </div>

    <div class="contenedor-tabla">
        <table id="tabla-panel"></table>
    </div>

    <div class="panel-botones">
        <div class="monitor-button-row">
            <button class="btn-comenzar" id="btnControl" type="button" onclick="solicitarInicioPartida()">EMPEZAR</button>
            <button class="btn-reiniciar" type="button" onclick="solicitarReinicioPartida()">REINICIAR</button>
        </div>
        <div class="monitor-button-row">
            <button class="btn-nueva-monitor" type="button" onclick="solicitarNuevaPartida()">NUEVO ID</button>
            <button class="btn-ir-carton" type="button" onclick="solicitarVolverCarton()">IR A CARTÓN</button>
        </div>
        <button class="btn-principal btn-home hide-in-pwa" type="button" onclick="solicitarVolverGames()">
            <svg class="home-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 11.5 12 4l9 7.5"></path>
                <path d="M5.5 10.5V20h13v-9.5"></path>
                <path d="M9.5 20v-6h5v6"></path>
            </svg>
            <span>Volver a Games</span>
        </button>
        <button class="help-button help-button-bottom" type="button" onclick="mostrarAyudaMonitor()" aria-label="Ayuda del monitor de Bingo">?</button>
    </div>

    <div id="monitorModalConfirm" class="modal-background">
        <div class="modal-box">
            <p id="textoMonitorModalConfirm">&iquest;Est&aacute;s seguro?</p>
            <div class="modal-flex-botones">
                <div class="modal-cell"><button class="btn-modal-ok" id="btnMonitorConfirmSi">S&iacute;</button></div>
                <div class="modal-cell"><button class="btn-modal-cancel" id="btnMonitorConfirmNo">No</button></div>
            </div>
        </div>
    </div>
    <div id="monitorModalAlert" class="modal-background">
        <div class="modal-box">
            <p id="textoMonitorModalAlert">Aviso del sistema</p>
            <button class="btn-modal-ok" onclick="cerrarAlertaMonitor()">Entendido</button>
        </div>
    </div>
    <script src="../assets/supabase-client.js"></script>
    <script src="../assets/js/bingo-monitor.js"></script>
</body>
</html>
