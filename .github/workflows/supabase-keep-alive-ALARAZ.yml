name: Mantener Supabase Alaraz activo

on:
  schedule:
    - cron: "23 7 * * *"

  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest

    steps:
      - name: Actualizar fecha en Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_ALARAZ }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY_ALARAZ }}
        run: |
          set -e

          response=$(curl --silent \
            --show-error \
            --fail \
            --max-time 30 \
            --request POST \
            "${SUPABASE_URL}/rest/v1/rpc/actualizar_keep_alive" \
            --header "apikey: ${SUPABASE_ANON_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            --header "Content-Type: application/json" \
            --data '{}')

          echo "Última comprobación Alaraz: ${response}"

          if [[ -z "${response}" || "${response}" == "null" ]]; then
            echo "No se recibió una fecha válida Alaraz."
            exit 1
          fi

          echo "Supabase Alaraz actualizado correctamente."
