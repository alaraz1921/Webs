<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error 404 - P&aacute;gina no encontrada</title>
    <link rel="stylesheet" href="assets/styles.css">
</head>
<body class="error-page">

    <h1 class="login-page-title">P&Aacute;GINA NO ENCONTRADA</h1>

    <div class="contenedor-error">
        <div class="numero-404">404</div>
        <p>El enlace que has seguido puede estar roto, haber cambiado de direcci&oacute;n o la partida ha terminado.</p>
    </div>

    <div class="error-actions">
        <a href="https://alaraz1921.github.io/Webs/" class="btn-regresar btn-home">
            <svg class="home-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 11.5 12 4l9 7.5"></path>
                <path d="M5.5 10.5V20h13v-9.5"></path>
                <path d="M9.5 20v-6h5v6"></path>
            </svg>
            <span>P&aacute;gina principal</span>
        </a>
        <button class="btn-regresar" type="button" onclick="abrirContactoModal(event)">Contacto</button>
    </div>

    <div class="modal-overlay" id="contacto-modal">
        <div class="modal-box">
            <button class="close-modal-btn" type="button" onclick="cerrarContactoModal()">&times;</button>
            <h3>Contacto</h3>
            <p>Quieres contarnos algo? Env&iacute;anos un email</p>
            <div class="modal-buttons-container modal-buttons-row">
                <a class="btn-modal-link" href="mailto:alaraz1921@gmail.com">ENVIAR</a>
                <button class="btn-modal-link btn-modal-cancel" type="button" onclick="cerrarContactoModal()">Cancelar</button>
            </div>
        </div>
    </div>

    <script>
        const contactoModal = document.getElementById('contacto-modal');

        function abrirContactoModal(event) {
            event.preventDefault();
            contactoModal.style.display = 'flex';
        }

        function cerrarContactoModal() {
            contactoModal.style.display = 'none';
        }

        contactoModal.addEventListener('click', (event) => {
            if (event.target === contactoModal) {
                cerrarContactoModal();
            }
        });
    </script>
</body>
</html>
