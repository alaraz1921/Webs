<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error 404 - P&aacute;gina no encontrada</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #1e293b; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; min-height: 100vh; text-align: center; }
        
        /* Contenedor principal estilo Monitor de Bingo */
        .contenedor-error { background: #334155; border-radius: 12px; padding: 40px 20px; width: 100%; max-width: 450px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); border: 1px solid #475569; }
        
        /* El 404 grande estilo "Bola Cantada" */
        .numero-404 { font-size: 6rem; font-weight: bold; color: #f59e0b; line-height: 1; margin-bottom: 15px; text-shadow: 0 4px 8px rgba(0,0,0,0.3); }
        
        h2 { font-size: 1.4rem; color: #cbd5e1; margin-bottom: 12px; }
        p { font-size: 1rem; color: #94a3b8; margin-bottom: 25px; line-height: 1.5; }
        
        /* Botón de retorno estilo "Validar Cartón" */
        .btn-regresar { display: block; width: 100%; padding: 14px; font-size: 1rem; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; color: white; background-color: #3b82f6; text-decoration: none; transition: background-color 0.2s, transform 0.1s; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        .btn-regresar:hover { background-color: #2563eb; }
        .btn-regresar:active { transform: scale(0.98); }
        
        /* Zona de la imagen al final */
        .imagen-decorativa { margin-top: 30px; max-width: 150px; height: auto; border-radius: 8px; opacity: 0.8; }
    </style>
</head>
<body>

    <div class="contenedor-error">
        <div class="numero-404">404</div>
        
        <h2>P&aacute;gina no encontrada</h2>
        <p>El enlace que has seguido puede estar roto, haber cambiado de dirección o la partida ha terminado.</p>
        
        <a href="https://alaraz1921.github.io/Webs/" class="btn-regresar">Ir a la web principal</a>
        
        <img id="fotoError" class="imagen-decorativa" src="https://placehold.co/150x150/0f172a/f59e0b?text=alaraz1921" alt="alaraz1921">
    </div>

</body>
</html>
