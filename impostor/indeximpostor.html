<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Impostor - Sala de Juego</title>
    <style>
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            text-align: center; 
            padding: 20px; 
            background-color: #0b132b; 
            color: #ffffff; 
            margin: 0;
        }
        
        .screen { 
            display: none; 
            max-width: 450px; 
            margin: 40px auto; 
            background: #1c2541; 
            padding: 30px; 
            border-radius: 20px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); 
            border: 2px solid #3a506b;
        }
        
        .active { display: block; }
        
        h2 { color: #4cc9f0; margin-top: 0; font-size: 24px; text-transform: uppercase; letter-spacing: 1px; }
        p { color: #cbd5e1; font-size: 15px; line-height: 1.5; }

        input, select, button { 
            width: 100%; 
            padding: 14px; 
            margin: 12px 0; 
            border-radius: 10px; 
            border: 2px solid #3a506b; 
            font-size: 16px; 
            box-sizing: border-box; 
            background-color: #0b132b;
            color: white;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: #4cc9f0;
        }

        button { 
            background-color: #4cc9f0; 
            color: #0b132b; 
            border: none; 
            font-weight: bold; 
            cursor: pointer; 
            transition: all 0.2s ease;
            text-transform: uppercase;
        }
        
        button:hover { 
            background-color: #4361ee; 
            color: white;
            transform: translateY(-1px);
        }
        
        .btn-danger { background-color: #f72585; color: white; }
        .btn-danger:hover { background-color: #b5179e; }
        .btn-secondary { background-color: #3a506b; color: white; border: none; }
        .btn-secondary:hover { background-color: #5c7aff; }

        .reveal-box { 
            background: #0b132b; 
            color: #ffb703; 
            padding: 50px 20px; 
            border-radius: 15px; 
            margin: 25px 0; 
            font-size: 22px; 
            font-weight: bold;
            border: 2px dashed #4cc9f0;
            user-select: none; 
            -webkit-user-select: none; 
            cursor: pointer;
        }

        /* MODALES */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 19, 43, 0.85); 
            backdrop-filter: blur(4px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        .modal-box {
            background: #1c2541;
            border: 3px solid #ffb703; 
            padding: 30px;
            border-radius: 20px;
            max-width: 400px;
            width: 85%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.7);
            animation: popUp 0.3s ease-out;
        }
        
        @keyframes popUp {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        
        .modal-box h3 { color: #ffb703; margin-top: 0; font-size: 22px; text-transform: uppercase; }
        .modal-box p { color: #ffffff; font-size: 16px; margin: 20px 0; }
        .modal-footer-buttons { display: flex; flex-direction: column; gap: 5px; }
    </style>
</head>
<body>

    <div id="custom-modal" class="modal-overlay">
        <div class="modal-box">
            <h3 id="modal-title">Aviso</h3>
            <p id="modal-message">Mensaje del sistema.</p>
            <div id="modal-buttons" class="modal-footer-buttons">
                <button id="modal-default-btn" onclick="cerrarModal()">Entendido</button>
            </div>
        </div>
    </div>

    <div id="screen-lock" class="screen active">
        <h2>Acceso Restringido</h2>
        <p>Introduce la clave para entrar:</p>
        <input type="text" id="pinInput" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="0000">
        <button onclick="verificarClave()">Acceder</button>
    </div>

    <div id="screen-config" class="screen">
        <h2>Configuración</h2>
        <label>¿Cuántos juegan?</label>
        <select id="totalPlayers" onchange="guardarConfiguracionBase()"></select>
        
        <label>¿Cuántos impostores?</label>
        <select id="totalImpostors" onchange="guardarConfiguracionBase()">
            <option value="1">1 Impostor</option>
            <option value="2">2 Impostores</option>
        </select>
        <button id="btn-continue" onclick="generarInputsNombres()">Continuar</button>
        
        <div id="container-names"></div>
        <button id="btn-start" style="display:none;" onclick="iniciarSorteo()">Comenzar Sorteo</button>
    </div>

    <div id="screen-draw" class="screen">
        <h2 id="player-turn-name">Turno de: </h2>
        <p>Pasa el móvil a este jugador. Mantén pulsado el recuadro para ver tu rol:</p>
        <div id="reveal-area" class="reveal-box" onmousedown="mostrarRol()" onmouseup="ocultarRol()" ontouchstart="mostrarRol()" ontouchend="ocultarRol()">
            MANTÉN PULSADO
        </div>
        <button id="btn-next-player" onclick="siguienteJugador()">Siguiente Jugador</button>
    </div>

    <div id="screen-game" class="screen">
        <h2>Partida en Curso</h2>
        <p>¡Debatid! Cuando creáis saber quiénes son los impostores, escribid sus nombres:</p>
        <div id="impostor-inputs-evaluation"></div>
        <button onclick="evaluarImpostores()">Resolver</button>
        <button class="btn-danger" onclick="rendirse()">Rendirse / Revelar</button>
    </div>

    <script>
        const LUGARES = ["Hospital", "Estación Espacial", "Playa Tropical", "Hollywood", "Submarino", "Casino Bingo", "Restaurante", "Escuela"];
        
        // Variables de estado
        let jugadores = [];
        let roles = {}; 
        let impostoresAsignados = [];
        let jugadorActualIndex = 0;
        let lugarSecreto = "";
        let faseActual = "BLOQUEO";

        // Inicializar desplegable de número de jugadores (3 a 20)
        const selectP = document.getElementById('totalPlayers');
        for(let i=3; i<=20; i++) {
            let opt = document.createElement('option');
            opt.value = i; opt.textContent = i + " Jugadores";
            selectP.appendChild(opt);
        }

        // AL CARGAR LA PÁGINA: Comprobar el estado del LocalStorage
        window.onload = function() {
            comprobarExpiracionTiempo();
            cargarEstadoJuego();
        };

        // Comprueba si pasaron más de 5 horas desde la última validación exitosa
        function comprobarExpiracionTiempo() {
            const loginTimestamp = localStorage.getItem('impostor_login_time');
            if (loginTimestamp) {
                const cincoHorasEnMs = 5 * 60 * 60 * 1000;
                const tiempoTranscurrido = Date.now() - parseInt(loginTimestamp);
                
                if (tiempoTranscurrido > cincoHorasEnMs) {
                    reiniciarTodoSistema(); // Borra localStorage y fuerza login
                }
            }
        }

        // Guarda qué pantalla y qué datos tenemos activos
        function guardarEstadoJuego() {
            localStorage.setItem('impostor_fase', faseActual);
            localStorage.setItem('impostor_jugadores', JSON.stringify(jugadores));
            localStorage.setItem('impostor_roles', JSON.stringify(roles));
            localStorage.setItem('impostor_impostoresAsignados', JSON.stringify(impostoresAsignados));
            localStorage.setItem('impostor_jugadorActualIndex', jugadorActualIndex);
            localStorage.setItem('impostor_lugarSecreto', lugarSecreto);
            guardarConfiguracionBase();
        }

        function guardarConfiguracionBase() {
            localStorage.setItem('impostor_config_total', document.getElementById('totalPlayers').value);
            localStorage.setItem('impostor_config_imps', document.getElementById('totalImpostors').value);
        }

        // Recupera la partida si se refresca la pestaña
        function cargarEstadoJuego() {
            const sesionActiva = localStorage.getItem('impostor_login_time');
            if (!sesionActiva) return; // Si no hay login, se queda en pantalla de bloqueo.

            faseActual = localStorage.getItem('impostor_fase') || "CONFIGURACION";
            
            // Cargar selectores de configuración guardados
            if(localStorage.getItem('impostor_config_total')) document.getElementById('totalPlayers').value = localStorage.getItem('impostor_config_total');
            if(localStorage.getItem('impostor_config_imps')) document.getElementById('totalImpostors').value = localStorage.getItem('impostor_config_imps');

            if (faseActual === "BLOQUEO") {
                cambiarPantallaVisual('screen-lock');
            } else if (faseActual === "CONFIGURACION") {
                cambiarPantallaVisual('screen-config');
            } else {
                // Recuperar variables de juego en curso
                jugadores = JSON.parse(localStorage.getItem('impostor_jugadores')) || [];
                roles = JSON.parse(localStorage.getItem('impostor_roles')) || {};
                impostoresAsignados = JSON.parse(localStorage.getItem('impostor_impostoresAsignados')) || [];
                jugadorActualIndex = parseInt(localStorage.getItem('impostor_jugadorActualIndex')) || 0;
                lugarSecreto = localStorage.getItem('impostor_lugarSecreto') || "";

                if (faseActual === "REPARTO") {
                    prepararTurnoJugador();
                    cambiarPantallaVisual('screen-draw');
                } else if (faseActual === "PARTIDA") {
                    prepararPantallaResolucion();
                    cambiarPantallaVisual('screen-game');
                }
            }
        }

        // CONTROL DE MODALES
        function abrirModal(titulo, mensaje, esFinPartida = false) {
            document.getElementById('modal-title').textContent = titulo;
            document.getElementById('modal-message').textContent = mensaje;
            
            const btnContenedor = document.getElementById('modal-buttons');
            btnContenedor.innerHTML = ""; // Limpiar botones anteriores

            if (esFinPartida) {
                // Botón 1: Otra partida manteniendo el mismo grupo
                const btnMismos = document.createElement('button');
                btnMismos.textContent = "Nueva Partida (Mismos Jugadores)";
                btnMismos.onclick = function() {
                    cerrarModal();
                    reiniciarMismosJugadores();
                };
                
                // Botón 2: Reiniciar todo desde cero borrando todo
                const btnTodo = document.createElement('button');
                btnTodo.textContent = "Reiniciar Todo (Borrar Datos)";
                btnTodo.className = "btn-danger";
                btnTodo.onclick = function() {
                    cerrarModal();
                    reiniciarTodoSistema();
                };

                btnContenedor.appendChild(btnMismos);
                btnContenedor.appendChild(btnTodo);
            } else {
                // Botón normal de cierre
                const btnCerrar = document.createElement('button');
                btnCerrar.textContent = "Entendido";
                btnCerrar.onclick = cerrarModal;
                btnContenedor.appendChild(btnCerrar);
            }

            document.getElementById('custom-modal').style.display = 'flex';
        }

        function cerrarModal() {
            document.getElementById('custom-modal').style.display = 'none';
        }

        // LOGICA DE ACCESO
        function verificarClave() {
            const input = document.getElementById('pinInput').value;
            const hoy = new Date().getDate();
            const claveCorrecta = hoy + 1021;

            if (parseInt(input) === claveCorrecta) {
                localStorage.setItem('impostor_login_time', Date.now()); // Guardamos momento de entrada
                faseActual = "CONFIGURACION";
                guardarEstadoJuego();
                cambiarPantallaVisual('screen-config');
            } else {
                abrirModal("⚠️ Acceso Denegado", "La clave introducida es incorrecta.");
            }
        }

        function cambiarPantallaVisual(idPantalla) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(idPantalla).classList.add('active');
        }

        // LOGICA DE CONFIGURACIÓN Y JUEGO
        function generarInputsNombres() {
            const num = document.getElementById('totalPlayers').value;
            const container = document.getElementById('container-names');
            container.innerHTML = "<h3>Introduce los nombres:</h3>";
            
            for(let i=1; i<=num; i++) {
                container.innerHTML += `<input type="text" class="player-name-input" placeholder="Jugador ${i}" required>`;
            }
            document.getElementById('btn-continue').style.display = 'none';
            document.getElementById('btn-start').style.display = 'block';
        }

        function iniciarSorteo() {
            const inputs = document.querySelectorAll('.player-name-input');
            if (inputs.length > 0) {
                jugadores = Array.from(inputs).map(inp => inp.value.trim() || inp.placeholder);
            }
            ejecutarMezclaYAsignacion();
        }

        function ejecutarMezclaYAsignacion() {
            const numImpostores = parseInt(document.getElementById('totalImpostors').value);
            
            if (numImpostores >= jugadores.length) {
                abrirModal("Configuración Errónea", "No puede haber igual o más impostores que jugadores.");
                return;
            }

            lugarSecreto = LUGARES[Math.floor(Math.random() * LUGARES.length)];
            let copiaJugadores = [...jugadores];
            impostoresAsignados = [];
            
            for(let i=0; i<numImpostores; i++) {
                let index = Math.floor(Math.random() * copiaJugadores.length);
                impostoresAsignados.push(copiaJugadores.splice(index, 1)[0]);
            }

            roles = {};
            jugadores.forEach(j => {
                roles[j] = impostoresAsignados.includes(j) ? "Eres el IMPOSTOR 🏴‍☠️" : `Lugar: ${lugarSecreto} 🏙️`;
            });

            jugadorActualIndex = 0;
            faseActual = "REPARTO";
            guardarEstadoJuego();
            prepararTurnoJugador();
            cambiarPantallaVisual('screen-draw');
        }

        function prepararTurnoJugador() {
            document.getElementById('player-turn-name').textContent = "Turno de: " + jugadores[jugadorActualIndex];
            document.getElementById('reveal-area').textContent = "MANTÉN PULSADO";
            
            const btnNext = document.getElementById('btn-next-player');
            if (jugadorActualIndex === jugadores.length - 1) {
                btnNext.textContent = "Comenzar Partida";
            } else {
                btnNext.textContent = "Siguiente Jugador";
            }
        }

        function mostrarRol() {
            const nombre = jugadores[jugadorActualIndex];
            document.getElementById('reveal-area').textContent = roles[nombre];
        }

        function ocultarRol() {
            document.getElementById('reveal-area').textContent = "MANTÉN PULSADO";
        }

        function siguienteJugador() {
            if (jugadorActualIndex < jugadores.length - 1) {
                jugadorActualIndex++;
                localStorage.setItem('impostor_jugadorActualIndex', jugadorActualIndex);
                prepararTurnoJugador();
            } else {
                faseActual = "PARTIDA";
                guardarEstadoJuego();
                prepararPantallaResolucion();
                cambiarPantallaVisual('screen-game');
            }
        }

        function prepararPantallaResolucion() {
            const contenedorEval = document.getElementById('impostor-inputs-evaluation');
            contenedorEval.innerHTML = "";
            const numImpostores = impostoresAsignados.length;
            for(let i=1; i<=numImpostores; i++) {
                contenedorEval.innerHTML += `<input type="text" class="guess-impostor" placeholder="Nombre del Impostor ${i}">`;
            }
        }

        function evaluarImpostores() {
            const inputs = document.querySelectorAll('.guess-impostor');
            const respuestas = Array.from(inputs).map(inp => inp.value.trim().toLowerCase());
            const correctos = impostoresAsignados.map(imp => imp.toLowerCase());

            const aciertoTotal = correctos.every(imp => respuestas.includes(imp)) && respuestas.length === correctos.length;

            if (aciertoTotal) {
                abrirModal("🎉 ¡VICTORIA TOTAL!", "¡Felicidades! Habéis descubierto a todos los impostores: " + impostoresAsignados.join(' y ') + ".", true);
            } else {
                abrirModal("❌ Fallo", "Esos no son los impostores (o falta alguno por escribir). ¡Seguid debatiendo en el grupo!");
            }
        }

        function rendirse() {
            abrirModal("🏳️ Partida Terminada", "Os habéis rendido. Los impostores eran: " + impostoresAsignados.join(' y ') + `. El lugar secreto era: ${lugarSecreto}.`, true);
        }

        // RESOLUCIÓN DE FIN DE PARTIDA
        function reiniciarMismosJugadores() {
            // Reutiliza el array de `jugadores` existente y genera un nuevo escenario/roles directo
            ejecutarMezclaYAsignacion();
        }

        function reiniciarTodoSistema() {
            // Limpieza absoluta de la memoria del navegador
            localStorage.clear();
            jugadores = [];
            roles = {};
            impostoresAsignados = [];
            jugadorActualIndex = 0;
            lugarSecreto = "";
            faseActual = "BLOQUEO";
            
            // Reestablecer interfaz base
            document.getElementById('pinInput').value = "";
            document.getElementById('container-names').innerHTML = "";
            document.getElementById('btn-continue').style.display = 'block';
            document.getElementById('btn-start').style.display = 'none';
            
            cambiarPantallaVisual('screen-lock');
        }
    </script>
</body>
</html>
