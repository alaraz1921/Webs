name: FinTin checks
on:
  workflow_dispatch:
  push:
    paths: ['FinTin/**', '.github/workflows/fintin-check.yml']
  pull_request:
    paths: ['FinTin/**', '.github/workflows/fintin-check.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FinTin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: FinTin/package-lock.json
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test && npm run test:backup
      - name: Load existing public Supabase configuration
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          const config = readFileSync('../TrackTin/js/config.js', 'utf8');
          const value = key => {
            const match = config.match(new RegExp(key + ":\\s*'([^']+)'"));
            if (!match || /[\r\n]/.test(match[1])) throw new Error('Missing public config: ' + key);
            return match[1];
          };
          appendFileSync(process.env.GITHUB_ENV, 'VITE_SUPABASE_URL=' + value('SUPABASE_URL') + '\nVITE_SUPABASE_PUBLISHABLE_KEY=' + value('SUPABASE_ANON_KEY') + '\nVITE_BASE_PATH=/FinTin/\n');
          JS
      - run: npm run pages:prepare
      - name: Verify committed static output
        run: git diff --exit-code -- index.html assets
