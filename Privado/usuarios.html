<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Gestion de usuarios registrados de alaraz1921.">
    <title>Alaraz1921 | Gestion de usuarios</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="private-page private-users-page">
    <main class="private-login">
        <header class="app-page-header login-page-title">
            <p class="app-page-kicker">alaraz1921</p>
            <h1>USUARIOS</h1>
        </header>

        <section class="private-card private-content" id="users-admin-panel">
            <h1>GESTION DE USUARIOS</h1>
            <p class="private-user-email" id="users-admin-email">Comprobando sesion...</p>

            <div class="private-users-toolbar">
                <button type="button" id="user-create-open">Nuevo usuario</button>
            </div>

            <label for="users-search">Buscar usuario</label>
            <input id="users-search" type="search" placeholder="Nombre o email" autocomplete="off">
            <p id="users-admin-message" class="private-message" hidden></p>

            <div id="users-admin-list" class="private-admin-users-list">
                <p>Cargando usuarios...</p>
            </div>
        </section>

        <div id="user-edit-modal" class="private-modal" hidden>
            <div class="private-modal-box">
                <h2>Editar usuario</h2>
                <p id="user-edit-title"></p>
                <div id="user-edit-fields"></div>
                <div class="private-modal-actions">
                    <button type="button" id="user-edit-save">Guardar</button>
                    <button type="button" class="private-secondary-button" id="user-edit-cancel">Cancelar</button>
                </div>
            </div>
        </div>

        <div id="user-create-modal" class="private-modal" hidden>
            <div class="private-modal-box">
                <h2>Nuevo usuario</h2>
                <p>Crea un usuario de Supabase y asignale acceso a un proyecto.</p>
                <form id="user-create-form" class="private-modal-form">
                    <label>
                        Usuario
                        <input name="username" type="text" autocomplete="off" minlength="3" maxlength="30" required>
                    </label>
                    <label>
                        Email
                        <input name="email" type="email" autocomplete="email" required>
                    </label>
                    <label>
                        Contraseña
                        <input name="password" type="password" autocomplete="new-password" minlength="6" required>
                    </label>
                    <label>
                        Rol general
                        <select name="profile_role" required></select>
                    </label>
                    <label>
                        Proyecto
                        <select name="project_id" required></select>
                    </label>
                    <label>
                        Rol en el proyecto
                        <select name="project_role" required></select>
                    </label>
                    <div class="private-modal-actions">
                        <button type="submit" id="user-create-submit">Crear usuario</button>
                        <button type="button" class="private-secondary-button" id="user-create-cancel">Cancelar</button>
                    </div>
                </form>
            </div>
        </div>

        <div id="user-delete-modal" class="private-modal" hidden>
            <div class="private-modal-box">
                <h2>Borrar usuario</h2>
                <p id="user-delete-title"></p>
                <div class="private-modal-actions">
                    <button type="button" class="btn-danger" id="user-delete-confirm">Borrar</button>
                    <button type="button" class="private-secondary-button" id="user-delete-cancel">Cancelar</button>
                </div>
            </div>
        </div>

        <a class="private-back-link btn-principal btn-home" href="index.html">
            <svg class="home-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 11.5 12 4l9 7.5"></path>
                <path d="M5.5 10.5V20h13v-9.5"></path>
                <path d="M9.5 20v-6h5v6"></path>
            </svg>
            <span>Zona privada</span>
        </a>
    </main>
    <script src="../assets/supabase-client.js"></script>
    <script src="../assets/private-users.js"></script>
</body>
</html>
